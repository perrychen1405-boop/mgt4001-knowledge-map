 <div class="bottom-grid"><section class="panel learning-card"><div class="card-kicker">${icon('coffee',14)} 用一个故事，串起整门课</div><h3>如果你要开一家校园咖啡店……</h3><p>先看市场和自己的能力，再决定怎么竞争。<br>把五章知识，放进同一个具体问题里。</p><button class="inline-link" data-case-nav>进入串联案例 ${icon('arrow',13)}</button></section><section class="panel start-tip"><span class="tip-icon">${icon('light',19)}</span><div><h3>怎样用这份导读？</h3><p>先看地图建立框架，再点击知识点读解释。<br>标记“已掌握”，最后用自测检查是否真的理解。</p><button class="inline-link" data-nav="quiz" style="margin-top:11px">做一组自测 ${icon('arrow',13)}</button></div></section></div>`;}
function drawMap(){const board=document.getElementById('flow-board');if(!board)return;const svg=document.getElementById('map-svg');const b=board.getBoundingClientRect();const mobile=window.innerWidth<=720;const rect=id=>{const r=document.getElementById('flow-'+id).getBoundingClientRect();return {x:r.x-b.x,y:r.y-b.y,w:r.width,h:r.height};};let paths='';const routes=[['w1','w2'],['w1','w3'],['w2','w4'],['w3','w4'],['w4','w5']];for(const [a,z]of routes){const r=rect(a),t=rect(z);let x1=r.x+r.w,y1=r.y+r.h/2,x2=t.x,y2=t.y+t.h/2,d;if(mobile&&a==='w1'){x1=r.x+r.w/2;y1=r.y+r.h;x2=t.x+t.w/2;y2=t.y;d=`M${x1},${y1} C${x1},${y1+12} ${x2},${y2-12} ${x2},${y2-4}`;}else if(mobile&&a!=='w4'){x1=r.x+r.w/2;y1=r.y+r.h;x2=t.x+t.w/2;y2=t.y;d=`M${x1},${y1} C${x1},${y1+10} ${x2},${y2-10} ${x2},${y2-4}`;}else{const middle=(x1+x2)/2;d=`M${x1},${y1} C${middle},${y1} ${middle},${y2} ${x2-4},${y2}`;}paths+=`<path d="${d}" fill="none" stroke="${weekById[z].border}" stroke-width="1.5" marker-end="url(#map-arrow)"/>`;}
 if(!mobile){const r=rect('w5'),t=rect('w1'),y=b.height-13;paths+=`<path d="M${r.x+r.w/2},${r.y+r.h} V${y-12} Q${r.x+r.w/2},${y} ${r.x+r.w/2-12},${y} H${t.x+t.w/2+12} Q${t.x+t.w/2},${y} ${t.x+t.w/2},${y-12} V${t.y+t.h+6}" fill="none" stroke="#d9d9e7" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#map-arrow)"/><rect x="${b.width/2-83}" y="${y-8}" width="166" height="17" fill="#fff"/><text x="${b.width/2}" y="${y+3}" text-anchor="middle" font-size="9" fill="#a7a8bc">绩效反馈 · 持续调整战略</text>`;}
 svg.setAttribute('viewBox',`0 0 ${b.width} ${b.height}`);svg.innerHTML=`<defs><marker id="map-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#c7c7dc"/></marker></defs>${paths}`;
}
function nodeButton(n,w){return `<button class="concept-node ${mastered.has(n.id)?'mastered':''}" data-node="${n.id}"><span class="node-state">${mastered.has(n.id)?icon('check',10):''}</span><span class="node-copy"><strong>${esc(n.title)}</strong><small>${esc(n.en)}</small><p>${esc(n.summary)}</p></span><span class="node-chevron">${icon('chevron',12)}</span></button>`;}
function chapter(){const w=weekById[state.week];const filtered=w.nodes.filter(n=>!state.unlearned||!mastered.has(n.id));return `${heading(`CHAPTER 0${w.number} · ${w.englishShort}`,w.shortTitle,w.subtitle,`WEEK ${w.number} · ${w.pageCount} 页`)}<section class="chapter-intro" style="${style(w)}"><div class="chapter-icon">${icon(w.icon,25)}</div><div><h2>${esc(w.question)}</h2><p>${esc(w.takeaway)}</p></div></section><div class="toolbar"><span class="count">${filtered.length} 个知识点 · 已掌握 ${pct(w)}%</span><span class="pill green">${icon('check',10)} 点击节点阅读解释</span><label class="toggle"><input type="checkbox" id="unlearned-toggle" ${state.unlearned?'checked':''}>只看未掌握</label></div><section class="chapter-map" style="${style(w)}"><div class="chapter-root">${icon('nodes',17)}${esc(w.shortTitle)}</div>${filtered.length?`<div class="groups-grid">${w.groups.map(g=>{const nodes=g.nodeIds.map(id=>byId[id]).filter(n=>n&&(!state.unlearned||!mastered.has(n.id)));return nodes.length?`<div class="concept-group"><h3 class="group-title"><span>${esc(g.title)}</span><small>${nodes.length} 个</small></h3><div class="node-list">${nodes.map(n=>nodeButton(n,w)).join('')}</div></div>`:'';}).join('')}</div>`:`<div class="empty-state">${icon('check',35)}<h2>这一章已经全部标记为掌握</h2><p>取消“只看未掌握”可回看全部知识点，或用自测再检查一次。</p></div>`}</section><div class="chapter-bottom"><p>导读是对课件的整理。定义与表格有疑问时，可在详情里回看原页。</p><button class="button" data-chapter-quiz="${w.id}">${icon('quiz',14)} 练习本章 ${w.quiz.length} 题 ${icon('arrow',13)}</button></div>`;}
function getRelations(id){const relations=links.filter(l=>l.from===id||l.to===id).map(l=>({...l,target:byId[l.from===id?l.to:l.from]}));const w=weekById[byId[id].weekId],g=w.groups.find(g=>g.nodeIds.includes(id));if(g){const index=g.nodeIds.indexOf(id);for(const adjacent of [g.nodeIds[index-1],g.nodeIds[index+1]])if(adjacent&&!relations.some(l=>l.target.id===adjacent))relations.push({target:byId[adjacent],reason:'同一主题：'+g.title+'，继续阅读'});}return relations;}
function openNode(id,updateHistory=true){const n=byId[id];if(!n)return;const w=weekById[n.weekId];activeNode=id;if(!dialog.open){returnHash=location.hash||'#overview';focusBeforeDialog=document.activeElement;}if(updateHistory)history[dialog.open?'replaceState':'pushState']({},'',`#concept/${id}`);document.getElementById('detail-content').innerHTML=`<div style="${style(w)}"><div class="detail-head"><span class="pill">WEEK ${w.number} · ${esc(w.shortTitle)}</span><button class="icon-button" data-close aria-label="关闭知识点详情">${icon('close',17)}</button></div><div class="detail-body"><h1 id="detail-title" tabindex="-1">${esc(n.title)}</h1><p class="english-term">${esc(n.en)}</p><div class="detail-summary">${esc(n.summary)}</div><section class="detail-section"><h2>${icon('book',16)} 通俗理解</h2><p>${esc(n.explanation)}</p></section><section class="detail-section"><h2>${icon('nodes',16)} 抓住这些要点</h2><ul>${n.bullets.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>${n.example?`<section class="example-box"><h3>${icon('light',14)} ${esc(n.example.label)}</h3><p>${esc(n.example.text)}</p></section>`:''}<section class="pitfall-box"><h3>${icon('target',14)} 容易混淆</h3><p>${esc(n.pitfall)}</p></section>${getRelations(id).length?`<section class="detail-section"><h2>${icon('link',16)} 这个知识点连接到哪里？</h2>${getRelations(id).map(l=>{const t=l.target,tw=weekById[t.weekId];return `<button class="related-card" data-node="${t.id}" style="${style(tw)}"><span class="related-label">W${tw.number}</span><span><strong>${esc(t.title)}</strong><small>${esc(l.reason)}</small></span>${icon('chevron',13)}</button>`;}).join('')}</section>`:''}<section class="detail-section"><h2>${icon('file',16)} 回到原课件</h2><div class="source-links">${n.sourcePages.map(p=>`<a href="${sourceUrl(w,p)}" target="_blank" rel="noopener">第 ${p} 页 ${icon('external',11)}</a>`).join('')}</div><p class="source-caption">Week ${w.number} PDF 页码。点击在新标签打开课件；PDF 阅读器决定页码定位效果。</p></section><div class="detail-actions"><button class="button primary ${mastered.has(id)?'mastered-button':''}" data-master="${id}">${icon('check',15)} ${mastered.has(id)?'已掌握 · 点击取消':'标记为已掌握'}</button><button class="button" data-copy-node="${id}">${icon('link',13)} 复制链接</button><small>学习记录保存在当前浏览器</small></div></div></div>`;if(!dialog.open)dialog.showModal();dialog.scrollTop=0;document.getElementById('detail-title').focus({preventScroll:true});}

function quizPool(){const pool=questions.filter(q=>state.quizWeek==='all'||q.weekId===state.quizWeek);return state.quizMode==='wrong'?pool.filter(q=>Object.hasOwn(answers,q.id)&&answers[q.id]!==q.answer):pool;}

function quizView(){const pool=quizPool(),stats=Core.quizStats(questions.filter(q=>state.quizWeek==='all'||q.weekId===state.quizWeek),answers);state.quizIndex=Math.min(state.quizIndex,Math.max(0,pool.length-1));const q=pool[state.quizIndex],w=q?weekById[q.weekId]:weeks[0],selected=q?answers[q.id]:undefined;return `${heading('CHECK YOUR UNDERSTANDING','自测一下，理解到哪一步？','答题后查看解释，并回到对应知识点。学习目标是能说明理由。',`${questions.length} 道理解题`)}<div class="quiz-toolbar"><select id="quiz-week" aria-label="选择练习章节"><option value="all">全部五章</option>${weeks.map(w=>`<option value="${w.id}" ${state.quizWeek===w.id?'selected':''}>Week ${w.number} · ${esc(w.shortTitle)}</option>`).join('')}</select><select id="quiz-mode" aria-label="选择练习模式"><option value="all">全部题目</option><option value="wrong" ${state.quizMode==='wrong'?'selected':''}>只看错题</option></select><button class="button" data-reset-quiz>重新练习当前章节</button></div><p class="quiz-notice">每题首次选择后显示正确答案。想重新作答，可点击“重新练习当前章节”。</p>${q?`<div class="quiz-layout"><section class="panel quiz-card" style="${style(w)}"><div class="quiz-top"><span class="pill">WEEK ${w.number} · ${esc(w.shortTitle)}</span><span>第 ${state.quizIndex+1} / ${pool.length} 题</span></div><h2 id="question-title" tabindex="-1">${esc(q.question)}</h2><div class="quiz-options">${q.options.map((o,i)=>`<button class="quiz-option ${selected!==undefined?(i===q.answer?'correct':i===selected?'wrong':''):''}" data-answer="${i}" data-question="${q.id}" ${selected!==undefined?'disabled':''}><span class="option-letter">${'ABCD'[i]}</span><span>${esc(o)}</span>${selected!==undefined&&i===q.answer?icon('check',17):selected===i?icon('close',16):''}</button>`).join('')}</div>${selected!==undefined?`<div class="quiz-feedback" role="status" tabindex="-1"><strong>${selected===q.answer?'理解正确':'再想一想'} · 正确答案 ${'ABCD'[q.answer]}</strong><p>${esc(q.explanation)}</p><button class="inline-link" data-node="${q.nodeId}">回看相关知识点 ${icon('arrow',12)}</button><div class="source-links" style="margin-top:11px">${q.sourcePages.map(p=>`<a href="${sourceUrl(w,p)}" target="_blank" rel="noopener">课件第 ${p} 页 ${icon('external',10)}</a>`).join('')}</div></div>`:''}<div class="quiz-controls"><button class="button" data-question-index="${Math.max(0,state.quizIndex-1)}" ${state.quizIndex===0?'disabled':''}>${icon('back',13)} 上一题</button>${state.quizIndex<pool.length-1?`<button class="button primary" data-question-index="${state.quizIndex+1}">下一题 ${icon('arrow',13)}</button>`:`<button class="button primary" data-review-wrong>回看错题 ${icon('arrow',13)}</button>`}</div></section><aside class="panel question-numbers"><h3>练习进度</h3><p>点击题号可直接跳转。</p><div class="number-grid">${pool.map((n,i)=>`<button class="${i===state.quizIndex?'active ':''}${Object.hasOwn(answers,n.id)?answers[n.id]===n.answer?'correct':'wrong':''}" data-question-index="${i}" aria-label="第${i+1}题${Object.hasOwn(answers,n.id)?answers[n.id]===n.answer?'，已答对':'，答错':'，未作答'}">${i+1}</button>`).join('')}</div><div class="quiz-score"><div><strong>${stats.correct}</strong> / ${stats.answered} 已答题正确</div><button class="inline-link" data-review-wrong>${stats.wrongIds.length} 道错题 ${icon('arrow',12)}</button></div></aside></div>`:`<section class="panel empty-state">${icon('check',36)}<h2>${state.quizMode==='wrong'?'当前范围没有错题':'这里暂时没有题目'}</h2><p>${state.quizMode==='wrong'?'可以继续完成未答题，或切换章节复习。':'请选择其他章节。'}</p><button class="button primary" data-quiz-all style="margin-top:20px">回到全部题目</button></section>`}`;}
function sourcesView(){return `${heading('READ THE ORIGINAL','课件与整理说明','这份网页基于文件夹内五份 PPT 导出的 PDF，页码按 PDF 实际顺序计算。')}<div class="sources-grid">${weeks.map(w=>`<section class="panel source-card" style="${style(w)}"><span class="pill" style="color:var(--accent);background:var(--tint);border-color:var(--border)">WEEK ${w.number}</span><h3>${esc(w.shortTitle)}</h3><p>${esc(w.originalName)} · ${w.pageCount} 页 · ${w.nodes.length} 个整理知识点</p><a class="button" href="${sourceUrl(w)}" target="_blank" rel="noopener">${icon('file',13)} 打开原课件 ${icon('external',11)}</a></section>`).join('')}</div><section class="panel source-rules"><h3>如何理解来源与解释？</h3><p>每个知识点和自测题都有对应的课件页码。“通俗理解”是对原文的中文解释，英文术语保留以便对照。“帮助理解的例子”和“虚构教学情境”是为串联概念编写的例子，不代表课件提供的事实。</p><p>部分小节只有标题或内容很简短，相关节点会明确注明范围。第一章的 VRIO 与第三章的 VRIN 分别呈现；第三章四条件结果表与正文的不一致也保留提示，避免静默修改讲义。</p><p>跨章连线表示本导读归纳的理解关系，不是课件原图的复制。课程总览把第2章与第3章并排，是因为战略选择需要同时结合外部环境和内部能力。</p><p>掌握标记和答题记录保存在当前浏览器，不同设备及在线版、离线版之间不会自动同步。原文件内容未被修改。</p></section>`;}
function searchView(){const results=Core.search(weeks,state.query);return `${heading('SEARCH THE KNOWLEDGE',`搜索：${state.query}`,`找到 ${results.length} 个相关知识点。支持中文概念和英文术语。`)}${results.length?`<div class="search-results">${results.map(n=>{const w=weekById[n.weekId];return `<button class="result-card" style="${style(w)}" data-node="${n.id}"><span class="result-tag">WEEK ${w.number}</span><span><h3>${esc(n.title)}<small>${esc(n.en)}</small></h3><p>${esc(n.summary)}</p></span>${icon('chevron',15)}</button>`;}).join('')}</div>`:`<section class="panel empty-state">${icon('search',33)}<h2>没有找到这个知识点</h2><p>试试“竞争优势”“五力”“资源”或“VRIN”等关键词。</p></section>`}`;}
function render(focusSelector){const focused=document.activeElement;const restore=focusSelector||((main.contains(focused)||document.getElementById('sidebar').contains(focused))?focusSelectorFor(focused):null);sidebar();syncSidebarVisibility();main.innerHTML=state.query?searchView():({overview,chapter,connections,quiz:quizView,sources:sourcesView}[state.view]??overview)();if(restore)(document.querySelector(restore)??main).focus({preventScroll:true});requestAnimationFrame(drawMap);}
function route(){const [view,id]=location.hash.slice(1).split('/');if(view==='concept'&&byId[id]){const n=byId[id];state.view='chapter';state.week=n.weekId;state.query='';render();openNode(id,false);returnHash=`#chapter/${n.weekId}`;return;}if(dialog.open)dialog.close();state.view=['overview','chapter','connections','quiz','sources'].includes(view)?view:'overview';if(view==='chapter'&&weekById[id])state.week=id;state.query='';document.getElementById('global-search').value='';render();}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-nav'))navigate(b.dataset.nav,b.dataset.week);else if(b.hasAttribute('data-node'))openNode(b.dataset.node);else if(b.hasAttribute('data-close'))closeNode();else if(b.hasAttribute('data-master')){const id=b.dataset.master;mastered.has(id)?mastered.delete(id):mastered.add(id);const saved=Core.writeProgress(storage,[...mastered]);render();openNode(id,false);dialog.querySelector('[data-master]').focus({preventScroll:true});toast(saved?(mastered.has(id)?'已标记掌握，学习进度已保存':'已取消掌握标记'):'本次标记已更新，浏览器暂时无法保存');}else if(b.hasAttribute('data-copy-node')){try{await navigator.clipboard.writeText(location.href);toast('知识点链接已复制');}catch{toast('请从浏览器地址栏复制当前知识点链接');}}else if(b.hasAttribute('data-connect-tab')){state.connectTab=b.dataset.connectTab;render();}else if(b.hasAttribute('data-case')){state.caseIndex=Number(b.dataset.case);render();}else if(b.hasAttribute('data-case-nav')){state.connectTab='case';navigate('connections');}else if(b.hasAttribute('data-chapter-quiz')){state.quizWeek=b.dataset.chapterQuiz;state.quizIndex=0;state.quizMode='all';navigate('quiz');}else if(b.hasAttribute('data-answer')){const q=questions.find(q=>q.id===b.dataset.question);if(q&&!Object.hasOwn(answers,q.id)){answers[q.id]=Number(b.dataset.answer);saveAnswers();render('.quiz-feedback');}}else if(b.hasAttribute('data-question-index')){state.quizIndex=Number(b.dataset.questionIndex);render('#question-title');}else if(b.hasAttribute('data-review-wrong')){state.quizMode='wrong';state.quizIndex=0;render('#question-title');}else if(b.hasAttribute('data-quiz-all')){state.quizMode='all';state.quizIndex=0;render('#question-title');}else if(b.hasAttribute('data-reset-quiz')){questions.filter(q=>state.quizWeek==='all'||q.weekId===state.quizWeek).forEach(q=>delete answers[q.id]);saveAnswers();state.quizMode='all';state.quizIndex=0;render('[data-reset-quiz]');toast('当前练习记录已重置');}});
document.addEventListener('change',e=>{if(e.target.id==='unlearned-toggle'){state.unlearned=e.target.checked;render();}if(e.target.id==='quiz-week'){state.quizWeek=e.target.value;state.quizIndex=0;render();}if(e.target.id==='quiz-mode'){state.quizMode=e.target.value;state.quizIndex=0;render();}});
document.getElementById('global-search').addEventListener('input',e=>{state.query=e.target.value.trim();render();});
document.getElementById('menu-button').addEventListener('click',()=>{const s=document.getElementById('sidebar');s.classList.toggle('open');document.getElementById('menu-button').setAttribute('aria-expanded',s.classList.contains('open'));syncSidebarVisibility();if(s.classList.contains('open'))s.querySelector('button').focus();});
document.querySelector('.skip-link').addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView({block:'start'});});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!dialog.open){e.preventDefault();document.getElementById('global-search').focus();}if(e.key==='Escape'){const side=document.getElementById('sidebar');const wasOpen=side.classList.contains('open');side.classList.remove('open');document.getElementById('menu-button').setAttribute('aria-expanded','false');syncSidebarVisibility();if(wasOpen)document.getElementById('menu-button').focus();}});
dialog.addEventListener('cancel',e=>{e.preventDefault();closeNode();});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeNode();}});
window.addEventListener('hashchange',route);window.addEventListener('resize',()=>{syncSidebarVisibility();requestAnimationFrame(drawMap);});
document.getElementById('search-icon').innerHTML=icon('search',14);document.getElementById('menu-button').innerHTML=icon('menu',17);
route();
})();
</script>
</body>
</html>
