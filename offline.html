<script>window.COURSE = {"weeks":[{"id":"w1","title":"战略管理与战略竞争力","subtitle":"Week 1 · 从价值创造到三种超额回报模型","question":"企业为什么能比竞争者创造更多价值，并赚取同等风险下的超额回报？","takeaway":"以 A–S–P 串起分析、战略与绩效；用 I/O、资源基础和利益相关者三个视角解释价值创造，再以愿景、使命与价值观明确方向。","groups":[{"id":"w1-foundations","title":"战略与绩效的基本语言","nodeIds":["w1-strategy","w1-advantage","w1-returns","w1-process"]},{"id":"w1-models","title":"超额回报的三种模型","nodeIds":["w1-io","w1-rbv","w1-vrin","w1-stakeholders","w1-reciprocity","w1-justice","w1-allocation"]},{"id":"w1-direction","title":"组织方向与课件边界","nodeIds":["w1-vision","w1-mission","w1-values","w1-scope"]}],"nodes":[{"id":"w1-strategy","title":"战略与战略竞争力","en":"Strategy & Strategic Competitiveness","summary":"制定并实施创造价值的战略，才可能取得战略竞争力。","explanation":"战略是为了运用核心竞争力并取得竞争优势而作出的一套整合、协调的承诺与行动。它要求企业在竞争性的备选方案中选择自己的道路，因此也明确企业会做什么、不会做什么。战略竞争力则是企业成功制定并实施价值创造战略时达到的状态。学习时应把“选择”与“执行”连在一起：只有计划而没有落地，或行动彼此冲突，都未满足讲义强调的整合与协调。核心竞争力是战略可以运用的基础，顾客价值与绩效则是检验战略的结果。","bullets":["战略的关键词：整合、协调、承诺、行动、核心竞争力、竞争优势。","选择战略意味着在互相竞争的备选方案中取舍，并划定行动范围。","战略竞争力来自价值创造战略的制定和实施，两者缺一不可。","第一章以超额回报为经济绩效目标，并把利益相关者价值纳入战略管理过程。"],"example":{"label":"帮助理解的例子","text":"一家餐厅决定服务赶时间的上班族，于是协调菜单、采购、出餐流程与门店位置；“不提供耗时的复杂菜式”也是战略选择的一部分。"},"pitfall":"战略不只是目标、口号或单项行动；讲义要求一组相互配合的承诺与行动。","sourcePages":[5,11,56,57]},{"id":"w1-advantage","title":"竞争优势及其持续性","en":"Competitive Advantage","summary":"竞争优势同时要求顾客获得优越价值，且对手无法或不值得模仿。","explanation":"企业实施所选战略，为顾客创造优越价值，而竞争者无法模仿这种价值或觉得模仿成本过高时，企业具有竞争优势。这里的优势是相对于竞争者而言，不能仅由企业自我宣称。讲义特别指出，几乎没有竞争优势能够永久持续；持续多久取决于对手取得技能并复制战略收益的速度。第十三页的知识检查也提示，当对手的复制努力停止或失败，企业才更有依据判断战略形成了优势。案例列举的是价值来源，不表示这些企业永久不会被赶上。","bullets":["顾客价值必须优于竞争者，而不是只满足企业内部的技术标准。","模仿的障碍可以来自能力不足，也可以来自成本高到不值得尝试。","持续性受竞争者学习、取得技能和复制利益的速度影响。","讲义案例：Apple 的品牌忠诚与软硬件创新；Amazon 的物流、快速配送、丰富的商品选择、退货体验和 Prime。","讲义案例：Coca-Cola 的品牌识别与全球分销网络；Samsung 的产品组合与研发创新。"],"example":{"label":"课件案例","text":"讲义用 Apple 说明：顾客愿意支付较高价格，软硬件整合与持续创新形成差异；用 Amazon 说明物流与顾客体验如何支持价值创造。"},"pitfall":"高利润、销量增长或领先功能本身，不足以证明竞争者无法复制顾客价值。","sourcePages":[6,7,8,13]},{"id":"w1-returns","title":"回报、风险与生存","en":"Above-Average Returns & Risk","summary":"超额回报的比较基准，是风险相近的其他投资回报。","explanation":"超额回报是超过投资者对其他同等风险投资所预期的回报，平均回报则等于这一预期水平。因此判断企业是否表现优越，不能只比较绝对金额，也必须考虑风险。讲义将风险定义为投资者对特定投资所产生经济收益或损失的不确定性，并指出有效风险管理可以减少这种不确定性。缺乏竞争优势或未处于有吸引力行业的企业，最多只能赚取平均回报；长期连平均回报也达不到，企业会先衰退、最终失败。风险管理与价值创造因而都影响投资者的判断。","bullets":["超额回报：超过同等风险的其他投资所预期的回报。","平均回报：与同等风险投资的预期回报相等，不等同于会计利润为零。","风险：经济收益或损失的不确定性，而非仅指亏损发生的可能。","有效管理风险能降低投资者对投资结果的不确定性。","长期无法达到至少平均回报，会导致企业衰退并最终失败。"],"example":{"label":"帮助理解的例子","text":"假设投资者对同等风险项目预期回报为 8%，某项目获得 11% 才可称相对该基准的超额回报；数字仅用于说明比较方式。"},"pitfall":"不能拿高风险企业的高回报，直接与低风险投资比较后就判定存在超额回报。","sourcePages":[9,10]},{"id":"w1-process","title":"A–S–P 战略管理过程","en":"Analysis–Strategy–Performance","summary":"分析提供战略输入，制定与实施战略影响绩效，绩效再反馈到分析。","explanation":"战略管理过程是企业为取得战略竞争力及超额回报所作的全部承诺、决策和行动。A–S–P 将它串成分析、战略和绩效：分析外部环境与内部组织，形成愿景、使命和价值观，再选择并实施战略以达到期望绩效。第十二页图示把战略制定与战略实施并列并连接，两者共同通向竞争力及超额回报，结果还反馈回分析。第五十五页加入对直接竞争者未来目标、当前战略、假设及能力的分析，说明战略选择需要具体竞争信息。过程是理性且有纪律的持续工作。","bullets":["A：外部环境与内部组织分析，为选择战略提供基础输入。","方向：分析结果支持愿景、使命和价值观，指导后续行动。","S：制定战略并决定实施哪些战略；图示区分制定与实施且显示相互联系。","P：评价战略竞争力与超额回报，并通过图示反馈回到分析。","竞争者分析的四个维度是未来目标、当前战略、假设及能力；第二章会进一步展开。","掌握这一过程有助于创造利益相关者价值，但不是机械执行步骤就保证成功。"],"example":{"label":"帮助理解的例子","text":"企业先研究顾客需求与自身配送能力，再决定服务范围并配置团队，最后用顾客价值和回报检验效果；结果变化时重新分析。"},"pitfall":"A–S–P 不是一次性的写计划活动；图示有结果反馈，战略实施也与制定互相联系。","sourcePages":[11,12,54,55,56,57]},{"id":"w1-io","title":"I/O 模型：先看行业","en":"Industrial Organization Model","summary":"I/O 认为外部行业结构对战略选择的影响，大于企业内部差异。","explanation":"产业组织模型从外部环境出发，要求企业寻找最有吸引力的行业或细分领域，并实施该行业特征所要求的战略。它假定行业内企业拥有相似的战略资源，资源流动性高，差异即使产生也较短暂；决策者理性并追求企业利益和利润最大化。因而模型更重视行业结构对可行战略与盈利潜力的约束。图示顺序是研究环境、寻找行业、识别战略、发展或取得资产技能、实施战略，再争取超额回报。五力帮助分析行业与适合的位置，经理的行动仍会影响绩效。","bullets":["假设一：外部环境的压力与限制决定哪些战略能带来超额回报。","假设二、三：同行拥有相似资源并追求类似战略；资源高度流动，企业间资源差异较短暂。","假设四：组织决策者理性，以企业利益为依归并表现为利润最大化行为。","行业特征包括规模经济、进入壁垒、多元化、产品差异、企业集中程度和市场摩擦。","实施路径：外部环境 → 有吸引力行业 → 战略制定 → 资产与技能 → 战略实施 → 超额回报。","五力用来识别盈利潜力与位置；成本领先提供较低成本的标准化产品，差异化提供顾客愿付溢价的产品。"],"example":{"label":"课件案例","text":"讲义把 Nvidia 与 MS-ChatGPT、农场与 Walmart、Samsung 与 Apple、航空与 Zoom 分别用作供应者、购买者、现有竞争和替代品关系的课堂提示。"},"pitfall":"I/O 假设资源相似且流动性高；“独特资源决定战略”属于资源基础模型的起点。","sourcePages":[17,18,19,20,21,22,23,58]},{"id":"w1-rbv","title":"资源基础模型：先看自身","en":"Resource-Based Model","summary":"企业独特的资源与能力，是战略及超额回报的基础。","explanation":"资源基础模型将企业视为一组独特资源与能力，并认为这些差异对战略选择及绩效的影响，比外部环境更大。资源是生产过程的投入，能力则是一组资源整合执行任务的本领；成为竞争优势来源的能力才称为核心竞争力。讲义的知识检查指出，资源和能力并非在企业之间高度流动。模型并未忽略行业：企业先识别资源、能力及其优势潜力，再寻找这些资源与能力能够利用机会的行业，最后选择并实施合适战略。单独拥有资源通常不足，整合使用才更可能创造优势。","bullets":["资源例子：资本设备、员工个人技能、专利、财务资金及有才干的经理。","资源分类：物质资本、人力资本、组织资本。","能力：将一组资源整合起来执行任务或活动的能力。","核心竞争力：能成为企业相对竞争者的竞争优势来源的能力。","基本假设：企业资源与能力独特，而且并非高度流动，差异不易被迅速消除。","路径：识别资源与相对强弱 → 判断能力 → 判断竞争优势潜力 → 寻找可利用机会的行业 → 制定并实施战略。"],"example":{"label":"帮助理解的例子","text":"设备、熟练员工和订单数据是资源；把它们协调成准确且快速的配送流程是能力；只有该能力形成相对对手的优势时，才可称核心竞争力。"},"pitfall":"资源、能力、核心竞争力是三个不同层次，不能把每项资产或每种能力都称为核心竞争力。","sourcePages":[25,26,27,30,59]},{"id":"w1-vrin","title":"资源判准与 VRIN / VRIO","en":"VRIN Criteria & VRIO Distinction","summary":"第29页正文列的是 V、R、I、N；第28页提及的 O 是组织，二者不能互换。","explanation":"讲义说明，有价值、稀缺、难以模仿且不可替代的资源与能力，才有成为竞争优势基础的潜力。第十九页之后的资源部分存在术语标注不一致：第二十八页写 V.R.I.Organization，第二十九页虽标“VRIO”，实际列出的第四项却是 Non-substitutable。学习时应以具体判准为准，把这四项记为 VRIN；VRIO 的 O 指组织，并非 N 的同义词。课件在此仅提到组织，没有展开组织支持的检验细节，因此不能把外部补充框架当成这一页已教授的内容。","bullets":["V · Valuable：帮助企业利用外部机会或抵消外部威胁。","R · Rare：很少有当前或潜在竞争者拥有。","I · Costly to Imitate：其他企业难以取得或模仿，成本高。","N · Non-substitutable：没有结构性等价物，不能由等效资源替代。","第28页提到 V.R.I.Organization（VRIO）；O 与不可替代的 N 是不同问题，课件未展开 O。","第29页与第59页的正文支持 VRIN 四判准；讲义也强调仅凭资源本身难以取得及维持优势。"],"example":{"label":"帮助理解的例子","text":"一项专利可能难以复制，但若对手能用另一种技术实现相同价值，仍可能未满足 N；企业是否有组织条件有效运用专利，则属于 O 的不同问题。"},"pitfall":"不要因为第29页括号写了 VRIO，就把 Non-substitutable 误译成 Organization；VRIN 的 N ≠ VRIO 的 O。","sourcePages":[28,29,59]},{"id":"w1-stakeholders","title":"谁是利益相关者","en":"Stakeholders & Classifications","summary":"利益相关者既能影响企业，也会受到企业目标、行动与结果的影响。","explanation":"利益相关者是对企业活动和结果有重要兴趣、能够影响企业且也受企业影响的个人、群体或组织。企业依靠他们实现自身目标，因此分析不能只关注股东。讲义提供两组分类：内部与外部按组织关系区分，主要与次要则按是否直接参与价值创造过程区分。员工属于内部群体；资本提供者、顾客、供应者、当地社区和工会在外部群体中出现。主要群体直接贡献价值，次要群体虽未直接贡献，仍能影响企业。两个分类标准不同，不宜将“外部”自动等同“次要”。","bullets":["内部利益相关者包括全体员工：管理人员与非管理人员。","外部群体包括主要资本提供者，以及顾客、供应者、当地社区和代表员工的工会。","主要利益相关者直接参与价值创造：供应者、员工、顾客、经营所在社区及融资者。","融资者的例子是股东与银行，说明利益相关者包括资本市场参与者。","次要利益相关者可以双向影响企业，但不直接贡献其创造的价值；讲义列举媒体、政府、非政府组织。","利益相关者导向管理关注这些群体的需要与关系，而不只维持最低参与。"],"example":{"label":"帮助理解的例子","text":"银行是外部利益相关者，但作为融资者也属于主要利益相关者；媒体属于讲义列举的次要群体，却仍可能影响企业声誉。"},"pitfall":"“内部/外部”与“主要/次要”是不同分类轴；次要并不等于毫无影响。","sourcePages":[32,33,34]},{"id":"w1-reciprocity","title":"利益相关者模型与互惠","en":"Stakeholder Model & Reciprocity","summary":"公平、尊重与信任促进互惠，使关系中的信息与合作支持价值创造。","explanation":"利益相关者模型把企业与各群体的关系作为超额回报的重要来源。图示先要求识别价值创造中重要的群体，再基于公平、尊重和信任建立关系。这样可能促进互惠：利益相关者愿意参与、保持忠诚、协助目标并分享有价值的信息。企业据此了解需要，寻找流程改善与产品创新，再在战略制定和实施中合作。管理者可能支付更好的工资福利、回馈社区，或以较低价格提供优质服务，因而承担较高成本。关系带来的收益与额外投入必须一起考虑，不能只看善意。","bullets":["模型路径：识别重要利益相关者 → 建立关系与互惠 → 收集有用信息 → 制定战略 → 合作实施 → 争取超额回报。","互惠表现为参与意愿、忠诚、帮助企业达到目标，以及分享有价值的信息。","信息用途包括了解需要与期望、改善价值创造流程、提出产品创新。","战略制定可利用合作机会、创新产品与提升效率；实施时尽可能与利益相关者协作。","管理投入可能超过单纯留住其参与所需的水平，因此通常产生额外成本。","讲义列举较好工资福利、社区回馈、高质量产品或服务及较低价格作为这些投入的表现。"],"example":{"label":"帮助理解的例子","text":"企业尊重一线员工并回应其建议，员工可能更愿意分享流程问题；这些信息有机会减少错误并改进顾客体验。关系与绩效之间仍要靠战略行动连接。"},"pitfall":"关系良好是战略管理的一项重要成分，不能单独保证超额回报。","sourcePages":[34,35,37,60]},{"id":"w1-justice","title":"三种组织公正","en":"Organizational Justice","summary":"分配是否相称、决策是否听取意见、相处是否诚实尊重，是三种不同公正。","explanation":"公平是互惠的重要驱动力，讲义把组织公正分成分配、程序和互动三个主要类型。分配公正关注利益相关者得到的价值是否与其贡献相称；程序公正关注重要决策是否倾听并考虑受影响者的立场；互动公正关注所有群体是否被诚实、尊重且有诚信地对待。这些维度可以分别判断，也可能同时存在。合理回报并不能自动弥补粗暴沟通，参与意见也不表示最终分配一定相称。将三者分开，有助于解释为什么某项看似优惠的安排仍未获得认同或互惠。","bullets":["分配公正（Distributional justice）：通过关系获得的价值，与对企业的贡献相称。","程序公正（Procedural justice）：企业在会影响群体的重要决策中，倾听并考虑其立场。","互动公正（Interactional justice）：以诚实、尊重和诚信对待所有利益相关者。","三种公正都围绕关系中的公平，但分别观察结果、决策过程与日常对待。","课件将组织公正与互惠连接；分析案例应说明属于哪个维度，而不是只写“公平”。"],"example":{"label":"帮助理解的例子","text":"奖金与贡献相称属于分配公正；奖金规则制定前听取员工意见属于程序公正；经理诚实且尊重地解释规则属于互动公正。"},"pitfall":"程序公正不等于“所有人都能决定结果”；讲义要求倾听并考虑立场。","sourcePages":[36,60]},{"id":"w1-allocation","title":"利益相关者投入的边界","en":"Stakeholder Allocation & Limits","summary":"比竞争者提供可感知的更好价值，但过度投入可能损害公平与资源配置。","explanation":"利益相关者导向管理并非越慷慨越有效。讲义提醒，企业不一定在所有情境都因此取得超额回报；当创新、忠诚及较高动机并不重要时，按市场力量进行一般买卖交易可能更有效率。从经济效率角度，企业可为各群体提供比竞争者略好且能被感知的价值主张。再往上增加投入，可能令其他群体认为企业偏袒，也可能削弱投入其他重要资源或群体的能力。企业与所有主要群体都有依赖关系，但这种依赖并非在所有时间都同样强，管理需持续判断取舍。","bullets":["讲义明确：并非所有实行利益相关者管理的企业都能获得超额回报。","一般市场交易（arms-length transactions）可能适用于创新、忠诚和高动机较不关键的情况。","经济效率建议：提供比竞争者“刚好能明显感到更好”的价值主张。","过度分配可能被视为偏袒，从而降低其他群体对公平的感受。","长期分配差异过大，可能让企业缺少投入其他重要资源和利益相关者的资金。","依赖程度会因对象和时间变化；不要“giving away the store”，也不要默认所有群体总是同等优先。"],"example":{"label":"帮助理解的例子","text":"企业把几乎所有预算用于单一顾客群的优惠，可能挤压员工培训与供应者付款；顾客短期满意不代表整体关系和资源配置有效。"},"pitfall":"利益相关者模型不是无限满足每个人；重点是公平、互惠、成本与战略需要之间的判断。","sourcePages":[37,38,39]},{"id":"w1-vision","title":"愿景：希望成为怎样的组织","en":"Vision","summary":"愿景描绘理想的未来，通常较短，并应挑战人们且与行动一致。","explanation":"愿景是企业希望成为什么，以及大体上希望达到什么的图像。愿景声明描述理想组织并塑造预期未来，往往简短精练。有效愿景会拓展和挑战人们，由最高管理层及其他相关群体参与发展，而且与参与者的决策和行动一致。它建立在外部、内部及关系分析之上，也向利益相关者传达组织方向。课件图例把 Microsoft 的全球地方机会、成长与影响放在愿景位置，把 Tesla 成为推动电动车转型的卓越汽车企业作为愿景。案例应作为讲义表述学习，并非当今公司声明的实时核验。","bullets":["回答的问题：企业希望“成为怎样”与“广义上达到什么”。","声明描述理想组织和预期未来，通常简短、精练。","有效愿景会拓展和挑战人们，并与制定者的决策行动一致。","发展参与者包括 CEO 与高层、员工、供应者和顾客。","第47页另列 Volkswagen 的可持续移动与公众可达性、China Bank 的卓越金融服务机构、Vodafone 的互联世界通信领导者。"],"example":{"label":"课件案例","text":"第45页 Microsoft 愿景图强调在世界各地社区与国家创造机会、成长和影响；第46页 Tesla 愿景图强调成为有吸引力的汽车企业，并推动世界转向电动车。"},"pitfall":"愿景描述理想未来，不等于使命中具体的业务与顾客范围；也不等于数值化年度目标。","sourcePages":[41,42,45,46,47,51]},{"id":"w1-mission","title":"使命：竞争业务与服务对象","en":"Mission","summary":"使命比愿景更具体，明确企业拟竞争的业务及拟服务的顾客。","explanation":"使命规定企业打算在哪些业务中竞争，以及打算服务哪些顾客，因此比愿景更具体，也更直接涉及产品市场和顾客。它应体现组织的独特性，对各利益相关者有鼓舞力且相关。讲义建议由 CEO、高层及其他组织成员共同发展，并指出员工拥有强烈伦理意识时更可能有效。使命与愿景、价值观一起，在分析后形成方向，为恰当战略行动提供基础。红十字案例显示使命也适用于人道组织：对象、服务内容和行动方式可以明确，但不必用商业利润语言来写。","bullets":["回答的问题：在哪些业务中竞争、服务哪些顾客。","比愿景具体，应体现企业个性，并与所有利益相关者相关且有鼓舞力。","制定者包括 CEO、高层管理者和其他组织成员；员工伦理意识有助于使命有效。","第45页 Microsoft 使命图：帮助每个人与组织达成更多；第46页 Tesla 使命图：加快世界转向可持续能源。","第48页 American Red Cross 通过志愿者与捐赠者应对紧急情况下的人类苦难；ICRC 保护武装冲突及暴力受害者的生命、尊严并提供援助，同时推广人道规范。"],"example":{"label":"课件案例","text":"讲义把 American Red Cross 的紧急救援与资源动员，以及 ICRC 的中立、独立人道援助并列，可用来辨认服务对象、工作范围与组织个性。"},"pitfall":"不能只写“成为世界第一”就认为完成了使命；使命需要说明业务及服务对象。","sourcePages":[41,43,45,46,48,51]},{"id":"w1-values","title":"价值观：战略决策中重视什么","en":"Values","summary":"价值观明确决策与实施中最重要的原则，并指导奖励与利益相关者待遇。","explanation":"组织价值观规定管理者与员工在作出及实施战略决策时应最重视什么。它是商业伦理的实际应用，指导组织奖励和强化哪些行为，也帮助回答企业代表什么、如何理解自身目的。价值观应影响利益相关者的对待方式及重要决策中的优先顺序；有些企业将核心价值融入使命，有些另行列出以加强沟通。讲义指出，愿景、使命和价值观若发展不当，会失去战略行动所需方向，因此价值观需要与实际选择相连。课件的公司案例只是说明这种声明可以怎样表达。","bullets":["价值观用于战略决策及执行，而不仅是展示在墙上的文字。","它指导什么行为被奖励和强化，是商业伦理的实际应用。","它帮助定义组织目的，并影响利益相关者待遇与决策优先顺序。","核心价值可纳入使命，也可独立成文，用于向利益相关者说明企业坚持什么。","第45页 Microsoft 图列创新、多元与包容、社会责任、慈善、环境及可信计算。","第49页 McDonald’s 列 Serve、Inclusion、Integrity、Community、Family，强调顾客与员工、向所有人开放、做正确的事、社区与共同成长。"],"example":{"label":"课件案例","text":"McDonald’s 的 Integrity 被课件解释为“做正确的事”，Community 强调成为好邻居；这些是判断决策方式的原则，区别于未来地位或业务范围。"},"pitfall":"价值观不是愿景的未来状态，也不是使命的经营范围；必须能影响实际决策与行为。","sourcePages":[41,44,45,49,50,51]},{"id":"w1-scope","title":"课件范围与三模型联系","en":"Scope & Model Comparison","summary":"三个模型关注不同解释起点；仅有标题的部分应保留为待补材料。","explanation":"这一章的三模型可并用，但解释起点不同：I/O 先找有吸引力的外部行业，资源基础模型先辨认独特的内部资源与能力，利益相关者模型先建立有助互惠与价值创造的关系。课件第三十九页提出哪个模型最好帮助制定战略及决定总体目的的投票，却没有给出标准答案。另有两个内容边界：竞争格局部分只列标题并指向 Moodle 阅读材料，战略领导者部分也只有标题。第六十一页是 Delta、United 与 Star Alliance 的判断题，未提供答案；不宜补写成已教授的结论。","bullets":["I/O：行业结构 → 相应战略与所需资源 → 争取超额回报。","资源基础模型：独特资源与能力 → 能利用机会的行业与战略 → 争取超额回报。","利益相关者模型：公平关系与互惠 → 信息、合作及价值创造 → 争取超额回报。","第14–15页竞争格局只列标题，并注明阅读材料在 Moodle；课件未展开相关机制。","第52页战略领导者只列标题，未给出定义、职责或领导方式。","第39页投票及第61页判断题未提供答案；第二章会明确定义互补者并要求分析其作用。"],"example":{"label":"帮助理解的例子","text":"分析同一家配送公司时，可依次问行业是否有利润空间、企业有没有独特能力、员工与伙伴是否愿意合作；这些问题可以互相补充。"},"pitfall":"学习目标、标题、投票选项或未解答题目，不等于课件已经提供对应定义或唯一结论。","sourcePages":[14,15,39,52,58,59,60,61]}],"quiz":[{"id":"w1-q1","nodeId":"w1-advantage","question":"按照课件，什么最能支持“战略形成了竞争优势”的判断？","options":["对手已经复制了企业创造价值的战略","企业声明自己处于领先地位","对手复制该价值的努力停止或失败","企业仅制定了一个雄心勃勃的目标"],"answer":2,"explanation":"优势要求企业创造优越顾客价值，且对手无法模仿或模仿成本过高；第13页知识检查对应复制努力停止或失败。","sourcePages":[6,13]},{"id":"w1-q2","nodeId":"w1-io","question":"哪项属于 I/O 模型的基础假设？","options":["企业拥有独特且难流动的资源","外部环境的压力与限制决定可能产生超额回报的战略","资源差异一旦产生便长期保持","利益相关者的公平关系是唯一绩效来源"],"answer":1,"explanation":"第19页把外部环境约束列为首项假设；相似资源、高流动性及理性利润最大化也是 I/O 假设。独特资源是 RBV 的起点。","sourcePages":[19,23]},{"id":"w1-q3","nodeId":"w1-rbv","question":"设备、员工技能和专利被整合起来执行任务，这种整合执行的本领称为什么？","options":["能力（capability）","行业集中度","平均回报","次要利益相关者"],"answer":0,"explanation":"资源是生产过程投入；能力是一组资源整合完成任务或活动的本领。只有作为竞争优势来源的能力才称核心竞争力。","sourcePages":[25,26]},{"id":"w1-q4","nodeId":"w1-vrin","question":"第29页正文列出的第四项资源判准是什么？","options":["资源能自由流动","资源越多越好","组织（Organization）","不可替代（Non-substitutable）"],"answer":3,"explanation":"第29页正文第四项是不可替代，四项对应 VRIN。该页括号虽写 VRIO，第28页也提到 Organization，但 N 与 O 不能互换。","sourcePages":[28,29,59]},{"id":"w1-q5","nodeId":"w1-justice","question":"企业在重要决策前倾听并考虑受影响利益相关者的立场，最直接体现哪种公正？","options":["分配公正","程序公正","互动公正","不属于任何公正"],"answer":1,"explanation":"程序公正关注倾听与考虑立场的决策过程；分配公正关注所得与贡献相称，互动公正关注诚实、尊重及诚信的对待。","sourcePages":[36]}],"shortTitle":"战略管理基础","englishShort":"Foundations","mapQuestion":"目标是什么？优势从哪里来？","color":"#6966ba","tint":"#f1effb","border":"#dcd8f1","icon":"target","pageCount":62,"originalName":"MGT4001 Week1_post.pdf","number":1,"file":"week1.pdf"},{"id":"w2","title":"外部环境与竞争者分析","subtitle":"Week 2 · 七个环境分段、五力与对手回应","question":"外部变化如何改变机会、威胁和行业利润，而竞争者又会怎样行动与回应？","takeaway":"先区分总体环境、行业环境与竞争者环境；用七个分段读趋势，用五力判断行业结构，再用四维竞争者分析预测回应。","groups":[{"id":"w2-environment","title":"外部环境与七个分段","nodeIds":["w2-layers","w2-demographic","w2-economic","w2-political","w2-sociocultural","w2-technology","w2-global","w2-sustainable"]},{"id":"w2-forces","title":"五力与行业吸引力","nodeIds":["w2-entry","w2-supplier","w2-buyer","w2-substitutes","w2-rivalry","w2-attractiveness"]},{"id":"w2-competitors","title":"竞争者与生态系统","nodeIds":["w2-competitor"]}],"nodes":[{"id":"w2-layers","title":"外部环境的三个层次","en":"General, Industry & Competitor Environments","summary":"总体环境看趋势，行业环境看盈利结构，竞争者环境看具体对手。","explanation":"企业通过获取竞争者、顾客及其他利益相关者信息建立知识，再采取行动增强能力，缓冲负面影响并把握服务机会。总体环境由更广泛社会的七个分段组成，企业无法直接控制；行业环境是直接影响竞争行动及回应的五力；竞争者分析则关注具体对手的行动、回应和意图。三层分析共同影响愿景、使命、价值观、战略选择及执行。课件第十七页的外部环境分析过程仅列标题，第十九页提到扫描、监测、预测和评估四项工作，但未分别解释其步骤或定义。","bullets":["总体环境（general）：社会层面的趋势及影响，由七个环境分段组成，企业不能直接控制。","行业环境（industry）：新进入者、供应者、购买者、替代品和现有竞争，对行动与回应影响更直接。","竞争者环境（competitor）：理解具体对手，预测其行动、回应及意图。","三层结果共同影响愿景、使命、价值观、战略和实施中的竞争行动及回应。","第19页要求对各分段进行 scan、monitor、forecast、assess，以识别和评价机会与威胁；第17页过程部分仅列标题。","第58页“战略群组及其影响”仅列标题，没有给出定义或作用机制，不能作为本讲义已展开内容。"],"example":{"label":"帮助理解的例子","text":"人口老化是总体趋势；养老服务行业的进入壁垒属于行业结构；某家直接对手准备在哪个区域扩张属于竞争者分析。"},"pitfall":"七个分段与五力属于不同分析层次；课件未展开的过程或战略群组，不能自动补成讲义知识。","sourcePages":[4,5,6,8,13,14,17,19,58,60,65,66]},{"id":"w2-demographic","title":"人口分段","en":"Demographic Segment","summary":"人口规模、年龄、分布、族群与收入分配共同影响市场和劳动力。","explanation":"人口分段关注人口规模、年龄结构、地理分布、族群构成和收入分配。它不仅影响有多少顾客，也影响需求类型、劳动力组成与购买能力。课件以人口老化说明合资格劳动力、医疗、退休政策及商业机会的变化，并提醒企业可能更难招聘与保留适合员工。地理与族群组成会随时间改变；收入分配则帮助判断群体购买力及可自由支配收入。讲义还列举印度、中国、美国、印尼和巴基斯坦作为评估市场潜力的国家例子，这些是课件的研究提示，并非当前排名或增长保证。","bullets":["人口规模：课件预计本世纪人口持续增长但增速趋缓，企业需研究具体市场潜力。","年龄结构：人口老化影响劳动力供给、医疗、退休政策和商业机会。","地理分布：人口在国家和地区内的分布会随时间变化。","族群构成：变化会影响顾客需要与劳动力组成。","收入分配：群体购买力、可自由支配收入及家庭或个人平均收入都值得分析。"],"example":{"label":"课件案例","text":"第9页以 Aging Population 为人口分段例子；第21页进一步说明老化既可能产生医疗等机会，也可能威胁企业招聘与留才。"},"pitfall":"人口数量不等于实际市场购买力；年龄、分布与收入必须一起判断。","sourcePages":[9,10,20,21,22,30]},{"id":"w2-economic","title":"经济分段","en":"Economic Segment","summary":"经济的性质与走向影响增长机会，但趋势和影响都不易预测。","explanation":"经济环境是企业正在或可能竞争的经济体的性质与发展方向。企业一般希望在相对稳定、具有较强增长潜力的经济中竞争，但讲义强调预测经济趋势及其影响有难度。企业因此需要密切研究并预测所在经济体的增长与其他变化，以判断较大的增长机会在哪里。表格把通胀、利率、贸易与预算余额、个人和企业储蓄率及国内生产总值列为观察要素。这些指标提供外部条件信息，却不会单独决定某家企业成功；仍要连接具体市场、行业与企业行动进行分析。","bullets":["定义：企业竞争或可能竞争的经济体，其性质与方向。","讲义列举经济衰退作为经济分段变化的例子。","观察要素包括通胀率、利率、贸易赤字或盈余、预算赤字或盈余。","其他要素包括个人储蓄率、企业储蓄率和国内生产总值。","研究与预测有助于寻找增长机会，但课件指出经济趋势及其影响难以预测。"],"example":{"label":"帮助理解的例子","text":"利率变动可能改变融资条件，经济衰退可能影响需求；学习时应指出具体业务会受到怎样的作用，而不是只列一个宏观词语。"},"pitfall":"相对稳定且增长较强是企业通常偏好的条件，不是利润或战略成功的保证。","sourcePages":[9,10,23]},{"id":"w2-political","title":"政治与法律分段","en":"Political / Legal Segment","summary":"法律规则约束战略，企业与利益群体也会尝试影响这些规则。","explanation":"政治与法律分段是组织和利益群体争取关注、资源及发言权的领域，涉及规范国家之间、企业与政府机构之间互动的法律和监管。它有两个方向：企业尝试影响政府，也尝试理解政府当前及预期变化对竞争行动和回应的影响。法律和监管为战略与竞争行动提供结构。课件列出的要素包括反垄断、税务、放松监管理念、劳动培训法规及教育理念政策；监管变化被用作例子。分析时需要连接适用规则与经营选择，并区分已有规定和预测中的政策变化。","bullets":["关注组织和利益群体如何在法律监管领域争取关注、资源和发言权。","企业既会尝试影响政府，也要理解政府对自身竞争行动和回应的影响。","规则覆盖国家间关系，以及企业与政府机构的互动。","表格要素：反垄断法律、税法、放松监管理念、劳动培训法律、教育理念与政策。","法律和监管为战略行动提供结构；第9页以监管变化作例子。"],"example":{"label":"帮助理解的例子","text":"某行业新增经营许可要求，会改变企业能否进入和如何经营；这既可先作为政治法律趋势分析，也可能进一步影响五力中的进入壁垒。"},"pitfall":"政治法律分段不只指政党或选举，也包含直接影响业务的税务、教育及行业监管。","sourcePages":[9,10,24]},{"id":"w2-sociocultural","title":"社会文化分段","en":"Sociocultural Segment","summary":"社会态度与文化价值会塑造需求和工作观念，也会随时间改变。","explanation":"社会文化分段关注社会态度和文化价值。它们是社会的重要基础，并经常推动人口、经济、政治法律和技术条件的变化。虽然一个社会的态度与文化倾向相对稳定，讲义强调它们仍会改变，因此企业需要辨认变化，以保持竞争力并让消费者认为产品仍然相关。表格列举女性参与劳动力、劳动力多样性、工作生活质量态度、职业偏好以及产品服务特征偏好。分析的重点不是把某种文化当成固定标签，而是识别其对顾客与员工选择的具体影响，并关注变化方向。","bullets":["定义：社会的态度与文化价值。","社会文化变化可能推动人口、经济、政治法律及技术条件变化。","表格包括女性参与工作、劳动力多样性和工作生活质量态度。","其他要素是工作与职业偏好的变化，以及对产品、服务特征的偏好变化。","企业要识别变化，以保持领先并维持对消费者的相关性。"],"example":{"label":"课件案例","text":"第9页把消费者偏好改变作为社会文化例子；第43页也用快餐企业回应健康取向消费者的新品与促销说明竞争行动。"},"pitfall":"“相对稳定”不等于永远不变；文化标签也不能替代对具体顾客偏好的分析。","sourcePages":[9,11,25,43]},{"id":"w2-technology","title":"技术分段","en":"Technological Segment","summary":"技术分析既看新知识的形成，也看其如何变成产品、流程和材料。","explanation":"技术分段包括创造新知识，并将知识转化为新产出、产品、流程和材料的机构与活动。技术不仅是企业买到的设备，也包括研发、知识应用与通信方式。讲义要求持续扫描总体环境，寻找可替代当前技术的方案，以及企业可以从中取得竞争优势的新兴技术。表格列出产品创新、知识应用、私人和政府支持研发支出的重点及新通信技术；人工智能进展则是课堂例子。新技术可带来机会，同时也可能令现有技术与能力的价值下降，因而应与内部资源分析一起理解。","bullets":["定义覆盖新知识的创造与应用，以及产品、流程和材料的变化。","扫描一：寻找能够替代当前所用技术的潜在技术。","扫描二：识别企业可能从中获得竞争优势的新兴技术。","观察要素包括产品创新、知识应用、私人和政府支持研发支出的重点、新通信技术。","第9页以人工智能进展为例；课件强调技术创新正改变许多行业。"],"example":{"label":"帮助理解的例子","text":"若新技术能完成原有服务的功能，企业既要判断顾客是否会改用它，也要判断自己的资源是否仍有价值；这是外部变化与内部分析的联系。"},"pitfall":"技术分段并不只看最新产品发布；研发活动、知识转化及流程变化同样重要。","sourcePages":[9,11,26]},{"id":"w2-global","title":"全球分段与聚焦","en":"Global Segment & Globalfocusing","summary":"全球化同时打开新市场并引入外来竞争，全球聚焦尝试限制风险。","explanation":"全球分段包括相关的新全球市场及其文化和制度特征、正在改变的既有市场，以及重要国际政治事件。全球化让企业有机会进入新市场，也可能让其他经济体的竞争者进入本地市场。讲义提出 globalfocusing，即较谨慎地聚焦全球利基市场，利用已有能力并限制风险；这不是没有风险。企业还要理解各市场的社会文化和制度属性，分析非正规经济。课件以韩国的共同体、中国的关系、日本的群体和谐作文化课堂提示，使用这些提示时仍需研究具体市场，避免将例子视作所有个人的定律。","bullets":["全球要素：重要政治事件、关键全球市场、新兴工业化国家及不同文化和制度属性。","机会：进入新市场；威胁：来自其他经济体的竞争者进入原有市场。","Globalfocusing：聚焦全球利基市场的较谨慎路径，建立并运用能力，同时限制风险。","课件文化例子：韩国共同体取向、中国 guanxi（关系）、日本 wa（群体和谐与凝聚）。","非正规经济也是全球分段中需要分析的方面。"],"example":{"label":"帮助理解的例子","text":"企业先在少数适合自身专长的海外细分市场竞争，可用来理解 globalfocusing；同时仍需研究当地制度、文化与潜在竞争者。"},"pitfall":"全球聚焦不是全面进入所有国家；“限制风险”也不等于消除风险。","sourcePages":[9,12,27,28]},{"id":"w2-sustainable","title":"可持续自然环境分段","en":"Sustainable Physical Environment","summary":"自然环境变化与企业应对实践，由生态、社会和经济系统共同影响。","explanation":"可持续自然环境分段关注自然环境潜在及已经发生的变化，以及旨在积极回应这些变化、创造可持续环境的商业实践。讲义强调生态、社会与经济系统互相作用，企业也是相互联系的全球社会一部分，因此它不只是环境保护部门的孤立事务。表格列举能源使用、能源开发方式、可再生能源、环境足迹、水资源、环保产品及灾害应对。课件指出越来越多企业投资可持续发展，但也存在 greenwashing（漂绿）；判断时应区别实际实践与仅营造环保形象的表达。","bullets":["定义包含自然环境变化和企业积极回应这些变化的商业实践。","生态、社会及经济系统相互影响，企业处于互联的全球社会中。","能源要素：能源消耗、能源开发实践及可再生能源努力。","其他要素：减少环境足迹、水资源可用性、环保产品、回应自然或人为灾害。","第9页以气候变化为例；第29页同时提到可持续发展投资与漂绿现象。"],"example":{"label":"帮助理解的例子","text":"缺水趋势可能改变生产条件；节水流程是回应实践。若企业只宣传“绿色”却缺少相应行动，可用来理解讲义提醒的漂绿风险。"},"pitfall":"第29页提到漂绿但没有展开判定标准；不能把环保宣传自动当成已实现可持续绩效。","sourcePages":[9,12,29]},{"id":"w2-entry","title":"新进入者威胁与进入壁垒","en":"Threat of New Entrants","summary":"进入可能性取决于进入壁垒，以及新进入者预期会遭到的报复。","explanation":"新进入者可能威胁现有企业的市场份额，进入概率由进入壁垒与预期报复共同影响。规模经济使产量增加时单位成本下降，新企业未必能迅速获得足够需求；差异化与忠诚增加夺取顾客的难度。资本、转换成本、分销渠道、非规模成本优势及政策也会阻碍进入。预期现有企业迅速而猛烈回应，会降低进入可能，尤其当其在行业投入重大、资源充足或增长缓慢时。课件指出未被服务的利基可帮助避开壁垒，小型创业企业常适合寻找这类市场；这不意味着利基没有竞争风险。","bullets":["规模经济与差异化：单位成本随产量增加下降；顾客认为既有产品独特，新企业可能用低价吸引顾客。","资本要求与转换成本：设施、库存、营销等需要资金；顾客一次性换供应者的成本高时，新企业需明显降价或提供更好产品。","分销渠道：新企业要说服分销商增加或替换产品；折价和合作广告补贴会削弱利润潜力。","非规模成本劣势：既有企业有难以复制的成本优势，新企业需降低这些优势的战略重要性。","政策：许可、牌照、监管或放松监管及反垄断问题可控制进入。","预期报复：迅速猛烈回应降低进入概率；行业投入重大、资源充足、增长慢会强化报复预期，未服务利基可能帮助绕开壁垒。"],"example":{"label":"课件案例","text":"讲义用 Android 与 iOS 提示转换成本；用 Delta 与 Southwest 的定价回应，以及 McDonald’s 与 Burger King 的新品和促销回应，说明企业会考虑对手反应。"},"pitfall":"进入壁垒与退出壁垒不同；转换成本是顾客换供应者的一次性成本，也不是新企业自己的全部固定成本。","sourcePages":[35,36,37,38,39,40,41,42,43,57]},{"id":"w2-supplier","title":"供应者议价力","en":"Bargaining Power of Suppliers","summary":"供应者越难替换、投入越关键，越可能通过涨价或降质施加压力。","explanation":"供应者可以提高价格或降低产品质量，对行业企业施加压力。议价力高的条件来自相对集中程度、替代品缺乏、客户重要性、投入关键程度、转换成本与前向整合威胁。若少数大型供应者比购买行业更集中，购买企业更难找到其他来源；若这个行业不是供应者的重要顾客，买方也较难借购买规模影响它。关键投入与高转换成本进一步增强依赖。前向整合指供应者进入买方所处业务，因此供应者还可能成为竞争者。讲义的有机食品及油气例子说明稀缺、认证及供应扰动如何形成压力。","bullets":["供应者由少数大公司主导，而且比其销售对象的行业更集中。","行业企业找不到满意的替代投入品。","该行业不是供应者的重要顾客；供应者较不依赖这组客户。","供应投入对买方的市场成功关键。","供应产品的有效性形成买方较高的转换成本。","供应者能可信地前向整合进入买方行业，潜在成为其竞争者。"],"example":{"label":"课件案例","text":"有机食品供应者的稀缺或独特认证可能支持溢价；油气供应者在地缘政治紧张、供应中断或灾害时可能提高成本并限制供给。"},"pitfall":"“行业不是供应者的重要顾客”会增强供应者议价力；不要反读成行业采购越重要供应者越有力。","sourcePages":[34,44,46,47]},{"id":"w2-buyer","title":"购买者议价力","en":"Bargaining Power of Buyers","summary":"集中购买、卖方依赖、低转换成本及后向整合威胁，会增强买方权力。","explanation":"购买者为了降低成本，会争取更高质量、更好服务和更低价格。其议价力来自相对购买规模及卖方对销售收入的依赖：购买行业很大比例的产出，或占卖方年收入很大份额，都会增强买方影响。产品标准化或缺乏差异，以及容易低成本转向其他产品，也让买方更容易议价。可信的后向整合威胁意味着买方可能进入卖方业务，自己提供原本购买的产品，甚至成为竞争者。需要先界定行业再判断谁是购买者；在企业间市场中，购买者未必是最终消费者。","bullets":["买方要求更高质量、更高服务水平和更低价格，以改善自身成本条件。","购买行业总产出的比例较大。","所购产品的销售额占卖方年收入的重要比例。","买方几乎没有转换成本，能轻易转向其他产品。","行业产品无差异或标准化，并存在可信的后向整合威胁。","后向整合：买方进入卖方业务；供应者前向整合：供应者进入买方业务。"],"example":{"label":"帮助理解的例子","text":"一家大零售商若占某制造商大部分销量，且可以轻易换采购来源，便有较强议价条件；若还能自行制造，则增加后向整合威胁。"},"pitfall":"买方议价力与供应者议价力要相对所研究行业判断；同一企业在不同交易中可能分别是买方和供应者。","sourcePages":[34,45]},{"id":"w2-substitutes","title":"替代品威胁","en":"Threat of Substitute Products","summary":"替代品来自所界定行业以外，但实现相同或类似功能。","explanation":"替代品是来自某行业外部、却能执行与该行业产品相同或类似功能的商品或服务。这一定义以功能和行业边界为中心，不等于同一行业中另一个品牌。通常，当顾客转换成本低、替代品价格更低，而质量和性能相等或更好时，威胁更强。企业可以沿顾客重视的维度进行差异化，如质量、售后服务与位置，以降低替代方案吸引力。课件用健康饮品相对传统汽水、串流平台相对有线电视说明需求可转向不同形式的解决方案；分析前应说明采用的行业范围。","bullets":["判定：来自研究行业以外，能完成同样或类似功能。","触发条件一：顾客转换成本很低或没有。","触发条件二：替代品价格更低。","触发条件三：替代品质量及性能达到或超过原产品。","应对方向：在顾客重视的质量、售后服务、位置等维度差异化。","课件案例：健康饮品相对汽水；Netflix、Hulu、Disney+ 等串流服务相对有线电视。"],"example":{"label":"课件案例","text":"课件描述串流的按需内容与灵活观看方式吸引观众，促使有线电视商考虑自己的串流或组合方案；这说明同一需求可由行业外方案满足。"},"pitfall":"同一行业竞争品牌属于现有竞争；行业外实现相同功能的方案才属于五力中的替代品。","sourcePages":[48,49,50,51]},{"id":"w2-rivalry","title":"现有竞争与退出壁垒","en":"Intensity of Rivalry & Exit Barriers","summary":"慢增长、成本压力、低差异和退出困难，会加剧争夺现有顾客的竞争。","explanation":"行业内竞争会因对手行动挑战企业，或企业发现改善地位的机会而加剧，常围绕价格、售后服务与创新展开。竞争者众多或实力均衡，尤其少数同等规模企业，都可能积极回应对手。行业增长缓慢时，企业更多依靠抢夺对手顾客增加份额。高固定或储存成本鼓励提升产能使用，却可能形成全行业过剩；产品缺乏差异、转换成本低，则强化价格竞争。高战略利害与退出壁垒也会保留竞争压力，甚至让企业在资本回报低或为负时继续经营；退出难度和进入难度不是同一概念。","bullets":["竞争触发：被对手挑战，或发现提升市场地位的机会；常见维度为价格、售后服务和创新。","众多或均衡竞争者：企业互相关注并回应，少数规模与实力相当的企业也可激烈竞争。","缓慢或零增长：企业通过吸引竞争者顾客争夺份额。","高固定成本或高储存成本：追求产能利用可能形成全行业过剩产能。","低差异或低转换成本：产品被视为商品，购买决策主要看价格，较次看服务。","高战略利害及高退出壁垒；退出壁垒包括专用资产、退出固定成本、战略关联、情感、政府和社会限制。"],"example":{"label":"帮助理解的例子","text":"市场不再增长，而企业仍需承担昂贵设施的固定成本，便可能降价争夺对手顾客；若专用资产难转售，即使回报低也未必能轻易退出。"},"pitfall":"“竞争者数量少”并不自动意味着竞争弱；少数实力相当的企业也可能激烈对抗。","sourcePages":[52,53,54,55]},{"id":"w2-attractiveness","title":"五力与行业吸引力","en":"Five Forces & Industry Attractiveness","summary":"五力揭示行业盈利潜力，但企业仍需寻找能改善力量关系的竞争位置。","explanation":"行业是一组生产近似替代产品的企业。相比总体环境，行业环境更直接影响竞争行动与回应。五力分别分析进入者、供应者、购买者、行业外替代品和现有竞争，帮助判断所有行业企业获利的条件。较无吸引力行业通常进入壁垒低、供应者及买方强、替代威胁强、竞争激烈；较有吸引力行业则呈相反组合。讲义要求仔细研究并解释多来源资料，纳入国际市场与竞争。目标不仅是给行业贴标签，也要寻找能够使力量有利于企业，或缓冲其压力的位置，以争取战略竞争力和超额回报。","bullets":["行业定义：生产近似替代产品的一组企业；需要先说明行业边界。","五力：进入威胁、供应者权力、买方权力、替代品威胁、竞争激烈程度。","无吸引力组合：低进入壁垒、强供应者与买方、强替代威胁、激烈竞争。","有吸引力组合：高进入壁垒、弱供应者与买方、较少替代威胁、较温和竞争。","有效分析要仔细解释多来源数据，包含国际市场及竞争。","战略用途：找到可以把力量转为有利、或能缓冲不利力量的行业位置。"],"example":{"label":"帮助理解的例子","text":"行业整体买方较强，某企业仍可研究一个更重视独特服务的细分位置；这是用分析寻找位置，而不是把行业平均状况直接当成每家企业结果。"},"pitfall":"五力分析的是结构与盈利潜力，不是逐家企业的收益保证；“五力强”通常代表更大的盈利压力。","sourcePages":[13,31,32,34,56,67]},{"id":"w2-competitor","title":"竞争者四维分析与互补者","en":"Competitor Analysis, Intelligence & Complementors","summary":"目标、战略、假设与能力共同形成预期回应画像，互补者也必须纳入。","explanation":"竞争者分析聚焦企业直接面对的每一家对手。未来目标解释它想达到什么，当前战略显示它正在怎样竞争，假设显示其相信行业与自身什么，能力则揭示强弱。这四维信息用于建立预期回应画像：对手下一步会做什么、我方优势在哪里，以及关系将如何变化。竞争者情报是为理解和预测这四维而收集的数据与信息。课件还要求研究对手的互补者，即提供兼容的互补产品或服务的企业及网络；它们可能支持对手战略，并构成共同满足某项价值主张的复杂商业生态系统。","bullets":["未来目标：比较我方与对手目标、未来重心及风险态度，理解其驱动力。","当前战略：对手当前怎样竞争，战略是否支持竞争结构变化。","假设：对未来波动、现状、行业及自身的判断是什么；假设不同可能导致不同回应。","能力：强项与弱项，以及相对竞争者的能力水平。","回应画像综合四维；竞争者情报是帮助理解和预期目标、战略、假设与能力的数据及信息。","互补者出售兼容的互补商品或服务；商业生态系统是围绕某项价值主张、结合竞争与合作的互联组织网络。"],"example":{"label":"课件案例","text":"第63页用 bagel 与 cream cheese（贝果与奶油乳酪）说明互补关系；第68页强调完整竞争者分析也要检查支持对手战略形成和实施的互补者。"},"pitfall":"互补者不是替代品；仅看对手当前产品或财务数据，也不足以完成目标、战略、假设与能力四维分析。","sourcePages":[13,14,59,61,62,63,64,65,68]}],"quiz":[{"id":"w2-q1","nodeId":"w2-demographic","question":"人口规模、年龄结构、地理分布、族群构成与收入分配属于哪个分段？","options":["技术分段","经济分段","人口分段","政治法律分段"],"answer":2,"explanation":"课件第20页定义人口分段时列出这五项；第30页知识检查采用相同定义。","sourcePages":[20,30]},{"id":"w2-q2","nodeId":"w2-entry","question":"顾客向另一供应者购买时发生的一次性成本，叫什么？","options":["规模经济","转换成本","退出固定成本","产品差异化"],"answer":1,"explanation":"第38页定义 switching costs 为顾客转向不同供应者的一次性成本；高转换成本会提高新进入者吸引顾客的难度。","sourcePages":[38,57]},{"id":"w2-q3","nodeId":"w2-supplier","question":"哪种情况最可能增强供应者议价力？","options":["买方能轻易找到大量满意替代投入","行业是供应者极为重要且不可失去的顾客","买方转换供应者完全没有成本","少数供应者比购买行业更集中，且投入对买方成功关键"],"answer":3,"explanation":"供应者集中、没有满意替代品、投入关键及买方转换成本高，都会增强供应者力量；行业不是供应者重要顾客也会增强其力量。","sourcePages":[44]},{"id":"w2-q4","nodeId":"w2-rivalry","question":"按照课件，哪组条件较可能加剧行业内竞争？","options":["增长缓慢、产品缺乏差异、退出壁垒高","增长快速、顾客忠诚且企业容易退出","所有企业完全不回应对手行动","只有产品质量高而没有其他条件"],"answer":0,"explanation":"慢增长促使企业争夺对手顾客，低差异促进价格竞争，高退出壁垒可能使低回报企业继续留在行业；三者均为讲义所列加剧因素。","sourcePages":[53,54,55]},{"id":"w2-q5","nodeId":"w2-competitor","question":"一份完整的直接竞争者分析，首先应覆盖哪四个维度？","options":["人口、经济、政治法律、技术","价格、包装、颜色、店铺大小","未来目标、当前战略、假设、能力","顾客、银行、媒体、政府"],"answer":2,"explanation":"第61页列出未来目标、当前战略、假设及能力，并据此形成预期回应画像；第63、68页进一步要求关注互补者。","sourcePages":[61,62,63,68]}],"shortTitle":"外部环境分析","englishShort":"External analysis","mapQuestion":"市场有什么机会与威胁？","color":"#479d97","tint":"#edf8f5","border":"#cce9e3","icon":"globe","pageCount":68,"originalName":"MGT4001 Week2_post.pdf","number":2,"file":"week2.pdf"},{"id":"w3","title":"内部组织：从资源到竞争优势","subtitle":"Resources · Capabilities · Core Competencies","question":"企业拥有的东西，如何变成别人难以复制的价值？","takeaway":"资源需要被组合成能力；能力只有符合价值、稀缺、难模仿、不可替代四条件才是核心能力。再用价值链找出价值来源、弱项与外包边界，并持续防止核心能力僵化。","groups":[{"id":"w3-understand","title":"先回答：企业能做什么？","nodeIds":["w3-internal-fit","w3-value-judgment"]},{"id":"w3-build","title":"资源 → 能力 → 核心能力","nodeIds":["w3-resources","w3-intangible","w3-capabilities","w3-core-competencies"]},{"id":"w3-test","title":"优势是否站得住？","nodeIds":["w3-vrin","w3-imitation","w3-competitive-outcomes"]},{"id":"w3-chain","title":"价值在哪里产生？","nodeIds":["w3-value-chain","w3-primary-activities","w3-support-functions","w3-social-capital"]},{"id":"w3-renew","title":"外包、补足与更新","nodeIds":["w3-outsourcing","w3-rigidities"]}],"nodes":[{"id":"w3-internal-fit","title":"内部分析与内外匹配","en":"Internal Analysis & Strategic Fit","summary":"内部分析回答 can do，外部分析回答 might do，两者匹配才支持战略选择。","explanation":"企业通过获取、组合和运用资源，把外部机会转化为顾客价值。内部组织分析先判断企业凭资源、能力和核心能力能够做什么，再与外部机会和威胁所形成的可能行动相匹配。分析要有全球思维，不能只依赖单一国家、文化或情境的假设。现有优势会被竞争者学习，持续时间还受环境导致的能力过时、替代品和可模仿性影响。因此，管理当前核心能力与开发新能力必须同步进行，才能兼顾短期与长期竞争。","bullets":["Can do：由内部资源、能力与核心能力决定的行动能力。","Might do：由外部环境的机会与威胁决定的战略可能性。","Global mind-set：分析、理解和管理内部组织时，不受单一国家、文化或情境假设束缚。","传统资源不必然继续带来优势；跨国竞争要求理解企业独有的资源与能力组合。","所有竞争优势都有有限寿命：关注过时速度、替代方案和可模仿性，并同时发展新核心能力。"],"example":{"label":"帮助理解的例子","text":"企业发现海外市场有机会，是 might do；是否具备当地配送和服务能力，是 can do。两者匹配后才能决定如何进入。"},"pitfall":"看到外部机会，不等于企业已具备利用机会的能力；拥有当前优势，也不能推定它会永久持续。","sourcePages":[4,5,6,7,8,9]},{"id":"w3-value-judgment","title":"价值与管理判断","en":"Value & Managerial Judgment","summary":"价值由顾客愿付费的性能与属性衡量，内部战略决策常需要在不完整信息下作判断。","explanation":"价值由产品的性能特征，以及顾客愿意付费的属性衡量。企业创新地组合与运用资源，形成能力和核心能力，才能为顾客创造价值并支持超额回报。内部组织的战略决策通常不是例行事务，还具有伦理影响。管理者要识别、发展、配置和保护资源，却会面临环境与需求不确定性、条件相互关联的复杂性，以及组织内部冲突。当没有明显正确规则、资料不可靠或不完整时，判断能力十分重要；它要求警惕过度自信等认知偏差，也能从错误修正中学习。","bullets":["Value：产品性能特征与顾客愿付费属性体现的价值，顾客价值是超额回报的来源。","Uncertainty：一般环境、行业环境与顾客需求的特征并不完全确定。","Complexity：影响企业的条件彼此关联，使内部决策难以拆成孤立问题。","Intraorganizational conflicts：作决策的管理者之间，以及受决策影响的人之间，可能存在冲突。","Judgment：没有明显正确模型或规则，或资料不完整时，仍能作出成功决策的能力。","判断须留意认知偏差、承担有思考的风险；研究并纠正错误可以产生新的能力与核心能力。"],"example":{"label":"帮助理解的例子","text":"一家企业要投资新服务，但顾客需求尚未清晰、部门之间又有分歧。管理者需要运用判断，并根据试行结果学习。"},"pitfall":"价值不能只由企业投入多少来定义；管理判断也不等于凭直觉忽略资料或认知偏差。","sourcePages":[12,13,14,15,16]},{"id":"w3-resources","title":"资源与有形资源","en":"Resources & Tangible Resources","summary":"资源是能力的原料；有形资源可观察和量化，课件分为财务、组织、实物与技术四类。","explanation":"资源的范围涵盖个人、社会和组织层面的要素，是建立竞争优势的基础之一，但资源本身不能自动成为顾客价值或超额回报。企业须把资源组合成组织能力，再由能力发展核心能力。有形资源是能被观察和量化的资产，课件分为财务、组织、实物和技术四类。拥有设备、资金或技术只是起点，关键是如何使用这些资源。课件特别指出，有形资源较难进一步运用来产生额外业务或价值，因此数量多并不代表更容易形成竞争优势。","bullets":["资源 → 能力 → 核心能力 → 竞争优势：资源要经过组合和运用，不能直接跳到优势。","财务资源：企业借款能力，以及通过内部运营产生资金的能力。","组织资源：正式的报告结构，即组织内部的汇报关系。","实物资源：厂房和设备水平、地点吸引力、分销设施与产品存货。","技术资源：课件将版权、专利、商标与商业秘密等列在这一类有形资源中。","有形资源较难被进一步运用来衍生额外业务或价值；评价要看资源怎样被组合。"],"example":{"label":"帮助理解的例子","text":"两家公司拥有同样的仓库和车辆，却可能因调度流程与员工协作不同而产生不同配送表现。相同资源并不保证相同能力。"},"pitfall":"按本课件分类作答：Table 3.1把专利、版权、商标与商业秘密列为 technological resources，且归入有形资源；不要直接套用其他教材分类。","sourcePages":[18,19,20,23]},{"id":"w3-intangible","title":"无形资源的积累","en":"Intangible Resources","summary":"无形资源扎根于企业历史并长期积累，通常更难被竞争者理解、购买、模仿或替代。","explanation":"无形资源深植于企业历史，随时间逐渐积累，因此竞争者较难分析和模仿。课件把它们分成人力、创新和声誉三类：知识、信任及合作能力属于人力资源，创意与创新能力属于创新资源，品牌及利益相关者的正面评价属于声誉资源。它们较不显眼，却更常成为组织能力的基础，而且能够被进一步运用。分析时应关注这些要素如何支持企业完成任务，而非只问企业有哪些可见资产；仍然不能因为资源无形，就直接把它认定为核心能力。","bullets":["人力资源：知识、信任、技能，以及与他人合作的能力。","创新资源：创意、科学能力与创新的能力。","声誉资源：品牌名称、产品质量／耐用性／可靠性的认知，以及供应商和顾客等的正面评价。","长期积累和历史根源，使无形资源相对难被分析、模仿、购买或替代。","课件指出，无形资源更常作为能力基础，也更能被进一步运用。"],"example":{"label":"帮助理解的例子","text":"团队长期建立的信任能促进知识交流；这项无形资源可以与员工技能结合，形成更顺畅的协作能力。"},"pitfall":"无形资源、能力和核心能力是不同层次；品牌或信任的存在本身，尚未证明四项优势条件全部满足。","sourcePages":[21,22,23,24]},{"id":"w3-capabilities","title":"能力：资源的组织性组合","en":"Capabilities","summary":"能力把有形与无形资源结合起来，用于完成生产、分销和服务等组织任务。","explanation":"能力由各项有形和无形资源组合而成，体现企业怎样完成生产、分销和服务顾客所需的组织任务。它既是核心能力的基础，也可能支持竞争优势。能力往往依靠人力资本中信息与知识的发展、承载和交流。战略性人力资本则把员工的知识、技能和能力匹配到具体战略目标。因而，拥有员工、数据或设备是资源层面的描述，能够稳定运用它们完成任务才是能力层面的描述；是否进一步成为核心能力，还要经过四条件与竞争者比较。","bullets":["能力的来源是资源，组合对象同时包含有形与无形资源。","能力用于完成生产、分销和提供服务等组织任务。","知识与信息在人力资本中的发展、传递和交流，常是能力形成的基础。","战略性人力资本：把员工的知识、技能和能力与特定战略目标相匹配。","课件能力例子：Walmart的物流与库存控制、Microsoft的员工激励／授权／保留，以及营销领域的顾客服务。","能力可分布于分销、人力资源、信息系统、营销、管理、制造和研发等职能领域。"],"example":{"label":"课件案例","text":"Table 3.3将Walmart运用物流管理技术、通过销售点数据高效控制库存，列为不同职能领域的能力示例。"},"pitfall":"有效顾客服务在本课件能力示例表中属于 Marketing；每项能力都来自资源，但不是每项能力都构成核心能力。","sourcePages":[10,18,26,27,28,31]},{"id":"w3-core-competencies","title":"核心能力：独特价值的来源","en":"Core Competencies","summary":"核心能力是相对竞争者提供独特价值、并成为竞争优势来源的能力。","explanation":"核心能力是能让企业相对竞争者取得竞争优势的能力，反映企业的独特性和竞争上的区别。它不是突然出现的一项资产，而是在长期积累资源、学习怎样配置不同资源与能力的组织过程中形成。核心能力表现为企业相对竞争者特别擅长的活动，以及为产品或服务增加独特价值的活动。企业识别它时，需要使用可持续竞争优势的四个条件和价值链分析两种工具。判断必须同时考虑顾客眼中的价值与竞争者的表现，不能只根据内部自我评价。","bullets":["定义核心：它首先是一项能力，并且是企业相对竞争者的竞争优势来源。","体现企业的竞争区别与特性，是公司做得特别出色的活动。","在资源与能力的积累和配置学习中，经过时间逐渐形成。","通过这些活动，企业为顾客购买的产品或服务增加独特价值。","识别工具一：可持续竞争优势四条件；工具二：价值链分析。"],"example":{"label":"帮助理解的例子","text":"企业很擅长准时送货，但如果同行普遍同样擅长，它可能只是重要能力。只有进一步通过四条件检验，才可识别为核心能力。"},"pitfall":"“很重要”或“我们擅长”不足以证明核心能力；必须相对于顾客价值和竞争者来评估。","sourcePages":[29,30,33,44]},{"id":"w3-vrin","title":"四条件：V · R · I · N","en":"VRIN · Four Criteria of Sustainable Competitive Advantage","summary":"有价值、稀缺、模仿成本高且不可替代，四项同时满足才符合课件的核心能力定义。","explanation":"课件正文规定，能力同时具有价值、稀缺、模仿成本高和不可替代四个特征，才是核心能力。有价值指能够利用外部机会或抵御威胁；稀缺指只有少数竞争者拥有；模仿成本高指其他企业难以轻易发展相同能力；不可替代指没有战略上等效的能力。顾客视角要求它有价值且独特，竞争者视角则要求难模仿和不可替代。所有核心能力都是能力，但能力若未满足四条件，就不能据此称为核心能力。这里的第四项是不可替代性，需按本章原文理解。","bullets":["V — Valuable：帮助企业利用机会或抵御外部环境的威胁。","R — Rare：很少、甚至没有竞争者拥有该能力。","I — Costly to imitate：其他企业不能轻易发展出该能力，模仿需要高成本。","N — Nonsubstitutable：不存在战略上等效的能力。","正文强调四项同时满足；顾客的价值与独特性感知，以及竞争者能否模仿或替代，都要评估。"],"example":{"label":"帮助理解的例子","text":"某项服务能力能满足顾客需要，说明有价值；仍要继续问同行拥有多少、复制难不难，以及是否存在另一种等效服务方式。"},"pitfall":"本章第四条件是 Nonsubstitutable，不是“组织是否支持”的O；不能擅自把课件四条件改写成VRIO。","sourcePages":[9,30,33,34,35]},{"id":"w3-imitation","title":"为什么难以模仿？","en":"Historical Conditions · Causal Ambiguity · Social Complexity","summary":"独特历史、因果模糊和社会复杂性，能使竞争者难以复制一项能力。","explanation":"模仿成本高并不只是企业购买了昂贵设备。课件提出三种原因：独特历史形成的组织文化或品牌，竞争者难以看清能力的成因与使用方式，以及由人际关系、信任和友谊构成的社会复杂性。这些因素可以令其他企业难以轻易发展出相同能力。分析时要找出能力为何难复制，而不仅列出能力名称。与此同时，难模仿仍只是一项条件，必须继续考察能力是否有价值、是否稀缺，以及是否存在战略上等效的替代方案，才能判断核心能力。","bullets":["Historical：历史条件形成独特而有价值的组织文化或品牌。","Causal ambiguity：能力的原因与使用方式不清楚，竞争者难以知道应复制什么。","Social complexity：管理者、供应商与顾客之间的人际关系、信任和友谊难以简单复制。","评估重点是其他企业能否轻易发展相同能力，而不仅是复制某件资产的采购成本。","难模仿与不可替代不同：即使不能复制原能力，仍可能存在战略上等效的其他能力。"],"example":{"label":"帮助理解的例子","text":"竞争者看见一家企业的团队配合出色，却不清楚表现来自哪些长期关系与工作习惯，可能同时面对因果模糊与社会复杂性。"},"pitfall":"模仿是复制同样的能力，替代是通过战略上等效的其他能力实现作用；二者不能合并成同一检查项。","sourcePages":[34,35]},{"id":"w3-competitive-outcomes","title":"从竞争劣势到持续优势","en":"Competitive Consequences & Performance","summary":"价值、稀缺与模仿难度的不同组合，对应不同竞争后果；课件结果表与正文有一处表述差异。","explanation":"Table 3.5把条件组合与竞争后果、回报表现联系起来：四项均否时为竞争劣势；有价值但不稀缺且易模仿时为竞争均势；有价值、稀缺但易模仿时为暂时优势；表中有价值、稀缺且难模仿一行标为持续优势。需要注意，后三行的不可替代列都写成Yes/No，最后一行因此与正文四条件同时满足的要求存在表述不一致。学习时应保留这项来源差异，以正文定义识别核心能力，也不能把“持续”误解为没有期限。","bullets":["四项均为No：竞争劣势，回报低于平均水平。","有价值但不稀缺、易模仿：竞争均势，平均回报；表中N列为Yes/No。","有价值且稀缺，但易模仿：暂时竞争优势，平均至超额回报；表中N列为Yes/No。","有价值、稀缺且难模仿：表格标为持续竞争优势、超额回报，同时N列仍写Yes/No。","正文第33—35页要求四条件同时满足；第36页表格的N列没有保持这一表述，不能据表格删除不可替代条件。","可持续优势仍有有限寿命，要关注环境变化、替代方案与可模仿性。"],"example":{"label":"帮助理解的例子","text":"一项能力虽对顾客有价值，但同行普遍拥有，通常只能支持竞争均势；如果稀缺但很快被复制，优势也可能只是暂时的。"},"pitfall":"不要静默修改第36页的Yes/No，也不要用它推翻正文四条件；这里呈现的是课件内部表述差异。","sourcePages":[4,5,33,34,35,36]},{"id":"w3-value-chain","title":"价值链分析：找价值也找弱项","en":"Value Chain Analysis","summary":"价值链帮助分析成本位置、价值来源与短板，并比较企业和竞争者完成活动的方式。","explanation":"价值链是一种分析模板，帮助企业看清哪些运营部分创造价值、哪些没有创造价值，并了解成本位置与战略实施的多种方式。企业创造的价值要超过创造价值所发生的成本，才支持超额回报。价值链区分直接完成产品生产、销售、分销与服务的活动，以及支持这些工作的职能。任何一类都可能孕育能力或核心能力，但要相对竞争者评估。核心能力须让企业提供更优价值，或完成竞争者不能完成的价值活动；分析也应找出阻碍整体价值创造的弱项。","bullets":["分析目的：识别创造与不创造价值的运营部分，理解成本位置，并支持选定战略的实施。","回报条件：所创造的价值大于创造该价值所发生的成本。","课件模型包含 value chain activities 与 support functions 两类。","相对竞争者评估每一项活动的能力和核心能力，不能只看企业内部表现。","成为优势来源的活动，要创造高于竞争者的价值，或是竞争者无法完成的价值活动。","企业是价值创造系统，各环节互相依赖，因此需查找拖累整体价值的缺陷。"],"example":{"label":"帮助理解的例子","text":"产品质量很好，但配送经常出错，顾客得到的整体价值仍可能受损。价值链分析会把配送弱项连回整个价值创造系统。"},"pitfall":"价值链分析不只用于削减成本，也用于发现独特价值、能力培养机会和组织缺陷。","sourcePages":[39,40,41,44,45]},{"id":"w3-primary-activities","title":"五类价值链活动","en":"Value Chain Activities","summary":"课件主链由供应链管理、运营、分销、营销与销售、后续服务组成。","explanation":"本课件的价值链活动是企业生产产品，再把产品销售、分销并提供服务，以为顾客创造价值所完成的任务。Figure 3.3的主链依次为供应链管理、运营、分销、营销（含销售）和后续服务。Figure 3.4进一步说明：供应链处理采购和物流，运营把原料转成成品，分销把成品交给顾客，营销识别及满足顾客需要，后续服务在购买后增加价值。它们应被看成相互连接的价值系统，而且任何一个环节都可能发展为能力或核心能力。","bullets":["Supply-chain management：采购、转化与物流管理，以取得原料并转化为最终产品。","Operations：把原料有效转为成品，包括排班、流程与设施布局、产能及设备管理。","Distribution：把成品交给顾客，包括处理订单、选择配送渠道及安排顾客付款。","Marketing（including sales）：按独特需要细分目标顾客、满足和保留顾客、寻找新顾客；包括广告、品牌、定价及销售团队支持。","Follow-up service：满意度反馈、售后技术支持与履行保修等，用于增加顾客得到的产品价值。"],"example":{"label":"帮助理解的例子","text":"家电企业从采购零件到制造、送货、销售和保修，都可能影响顾客价值；可靠的售后服务也可能形成能力。"},"pitfall":"按本课件图3.3的五类名称理解主链；不要把其他版本的价值链分类直接替换进来。","sourcePages":[40,41,42]},{"id":"w3-support-functions","title":"四类支持职能","en":"Support Functions","summary":"财务、人力资源管理、信息技术管理和研发，支持主链工作，也可能成为核心能力来源。","explanation":"支持职能是为生产、销售、分销和服务工作提供支持的任务。课件模型列出财务、人力资源管理、信息技术管理和研发四类：财务取得与配置资金，人力资源管理培养和保留员工，信息技术管理收集和传播知识，研发发现或创造技术、产品与服务。支持的含义是它们在价值创造系统中的作用，而非表示价值较低。课件明确指出，价值链活动与支持职能的任何部分都能发展能力或核心能力；因此两类都必须相对竞争者评估，才能发现真正的优势来源。","bullets":["Finance：有效取得和管理财务资源，获得充足资本、配置投资，并维护资金提供者关系。","Human resources management：选聘、培训、保留和报酬管理，培养人力资本及相关能力。","Information technology management：取得和管理全企业信息与知识，选择技术并优化知识收集、传播与使用。","Research & development：发现或创造新技术、产品与服务；独特且难模仿的组合可形成核心能力。","支持职能与主链共同创造顾客价值，任何一项都可能产生能力与核心能力。"],"example":{"label":"帮助理解的例子","text":"统一信息系统让生产和配送共享需求信息。信息技术管理属于支持职能，但其能力仍可能影响企业对顾客的价值。"},"pitfall":"“支持”不是“次要”或“必然适合外包”；是否构成优势，要评估其价值及相对竞争者的能力。","sourcePages":[40,41,43,44]},{"id":"w3-social-capital","title":"信任与社会资本","en":"Trust & Social Capital","summary":"价值链依靠环节间关系，信任和利益相关者关系能支持顾客价值及企业成长。","explanation":"企业是价值创造系统，每个部分都依赖其他部分来创造价值。因此，完成价值链活动不仅需要单个部门的技能，也需要与利益相关者建立强健且富有成效的关系，即社会资本。课件把信任视为潜在竞争优势来源：人们较可能重复光顾并推荐自己信任的组织，这种关系能积累企业的社会资本，并支持成长、扩张和进入新市场。信任也是无形的人力资源，而复杂的信任关系能增加模仿难度。它的战略意义仍要放回顾客价值和核心能力条件中评估。","bullets":["价值创造系统：一个环节的价值创造依赖其他环节，不能只优化孤立部门。","Social capital：通过强健、富有成效的利益相关者关系，支持价值链活动的完成。","信任是潜在优势来源，也是课件列出的无形人力资源。","被信任的组织较容易获得重复光顾与顾客推荐，从而积累社会资本。","社会资本可支持成长、扩张和进入新市场；复杂关系也可能提高模仿难度。"],"example":{"label":"帮助理解的例子","text":"顾客愿意再次购买并向朋友推荐自己信任的服务机构，关系积累能帮助企业触及更多顾客。"},"pitfall":"课件说信任是“潜在”优势来源，并未认定所有信任关系都自动满足核心能力四条件。","sourcePages":[22,34,45,46,47]},{"id":"w3-outsourcing","title":"外包：选择边界与代价","en":"Outsourcing","summary":"外包是向外部供应商购买价值链或支持职能活动，应聚焦无法创造价值或明显落后于竞争者的活动。","explanation":"外包是从外部供应商购买一项创造价值的活动或支持职能。课件限定，企业应只对自身无法创造价值、或相对竞争者处于显著劣势的活动使用外包。有效外包能提高灵活性、缓解风险并降低资本投入。由于很少有企业在每项价值链活动和支持职能都拥有优势，缩小自行培养的能力范围，可减少过度扩张并集中发展核心能力。不过，外包可能损失创新能力与内部职位；企业有时也能研究供应商如何完成活动，反过来增强自身创新能力。","bullets":["定义：向外部供应商购买价值链活动或支持职能活动，重点涉及活动如何取得。","适用边界：课件要求只外包自身无法创造价值，或相对竞争者存在显著劣势的活动。","有效外包的收益：提高灵活性、缓解风险、减少资本投资。","聚焦较少能力，避免过度分散，可提升培育核心能力及竞争优势的机会。","主要顾虑：企业创新能力可能流失，以及内部工作职位减少。","学习机会：研究外包供应商的工作方式，有时能增强企业自己的创新能力。"],"example":{"label":"帮助理解的例子","text":"企业若无法有效完成某项配送活动，可比较外部供应商的能力后考虑外包，并把资源集中在有潜力创造价值的活动上。"},"pitfall":"外包不等于凡是更便宜就外购；课件强调价值创造和相对劣势，同时要求考虑创新与就业代价。","sourcePages":[49,50,51,52]},{"id":"w3-rigidities","title":"强弱项与核心僵化","en":"Strengths, Weaknesses & Core Rigidities","summary":"企业需要“合适”的资源与能力，并警惕曾经成功的核心能力成为阻碍创新的惯性。","explanation":"内部分析通过资源、能力和核心能力识别企业的强项与弱项。若实现竞争优势所需领域存在能力不足，企业必须获取资源并建立所需能力和核心能力。拥有大量资源并不等于拥有合适资源；合适资源能够被组成核心能力，进而为顾客创造价值和竞争优势。同时，任何核心能力都可能变成核心僵化，产生惯性并压制创新。如果企业把过去的能力当成永久优势，便可能忽略环境变化。持续检查、管理当前核心能力并发展新能力，是内部分析的重要意义。","bullets":["强弱项体现在企业拥有的资源、能力与核心能力之中。","需要优势却缺乏相应能力时，应获取资源，并建立所需能力和核心能力。","“合适”资源：具备被组成核心能力的潜力，从而支持顾客价值与竞争优势。","资源数量不等于资源适配性；关键是资源能否支持战略所需的能力。","Core rigidities：核心能力产生惯性、压制创新，成为核心僵化。","管理已有能力与发展新能力须并行，不能假设任何核心能力带来永久优势。"],"example":{"label":"帮助理解的例子","text":"某企业一直依靠熟练的大批量生产成功，却拒绝学习适应新需求的流程。原有能力可能从优势变为限制创新的惯性。"},"pitfall":"核心僵化不是资源突然消失，而是企业过度依赖既有能力，产生惯性并妨碍创新。","sourcePages":[5,54,55,56]}],"quiz":[{"id":"w3-q1","nodeId":"w3-capabilities","question":"依据课件，组织能力的来源是什么？","options":["行业竞争本身","资源的组合","超额回报","已经形成的竞争优势"],"answer":1,"explanation":"第18与26页说明，组织能力由有形与无形资源组合形成；能力再成为核心能力的基础。","sourcePages":[10,18,26]},{"id":"w3-q2","nodeId":"w3-vrin","question":"本章用于识别核心能力的第四项条件是什么？","options":["组织规模足够大","管理者高度自信","不可替代，没有战略上等效的能力","产品价格必须最低"],"answer":2,"explanation":"第33—35页正文列出有价值、稀缺、模仿成本高和不可替代四条件；不可替代指没有战略等效能力。","sourcePages":[33,34,35]},{"id":"w3-q3","nodeId":"w3-support-functions","question":"依据图3.3，下列哪一项属于支持职能？","options":["分销","后续服务","营销与销售","信息技术管理"],"answer":3,"explanation":"图3.3把信息技术管理与财务、人力资源管理及研发列为支持职能；分销、营销与后续服务列在价值链活动中。","sourcePages":[40,41,43]},{"id":"w3-q4","nodeId":"w3-outsourcing","question":"哪一种情况符合课件建议考虑外包的活动边界？","options":["企业无法在该活动创造价值，或相对竞争者处于显著劣势","企业已在该活动取得独特价值优势，因此一定要外包","所有活动都应外包以减少人员","只要外包报价低，就不需要评价能力与价值"],"answer":0,"explanation":"第49页限定外包应考虑自身无法创造价值或相对竞争者明显落后的活动，同时列出灵活性、风险与资本投入的收益。","sourcePages":[49]},{"id":"w3-q5","nodeId":"w3-rigidities","question":"企业认定核心能力会永久带来优势，主要有什么风险？","options":["资源自动变成更多能力","形成核心僵化，产生惯性并压制创新","所有无形资源立刻消失","无需再学习竞争者"],"answer":1,"explanation":"第55页指出，所有核心能力都有成为核心僵化的潜力，会造成惯性并压制创新；因此不能假定核心能力构成永久优势。","sourcePages":[55,56]}],"shortTitle":"内部资源与能力","englishShort":"Internal analysis","mapQuestion":"我们有什么？能做到什么？","color":"#bb975c","tint":"#fcf7eb","border":"#efdfc0","icon":"gem","pageCount":56,"originalName":"MGT4001 Week3_Post.pdf","number":3,"file":"week3.pdf"},{"id":"w4","title":"业务层战略：选择怎样竞争","subtitle":"Business-Level Strategy · Cost · Differentiation · Focus","question":"在选定产品市场里，企业靠什么优势为哪类顾客创造价值？","takeaway":"业务层战略把核心能力转化为产品市场中的日常竞争方式。成本领先、差异化、两种聚焦及整合成本领先／差异化，都要协调价值链活动，并理解其面对五力时的优势与风险。","groups":[{"id":"w4-foundation","title":"定位与顾客价值","nodeIds":["w4-business-strategy","w4-digital-strategy","w4-source-gaps"]},{"id":"w4-cost","title":"成本领先","nodeIds":["w4-cost-leadership","w4-cost-value-chain","w4-cost-five-forces","w4-cost-risks"]},{"id":"w4-differentiate","title":"差异化","nodeIds":["w4-differentiation","w4-diff-value-chain","w4-diff-five-forces","w4-diff-risks"]},{"id":"w4-focus","title":"聚焦特定细分市场","nodeIds":["w4-focus","w4-focus-risks"]},{"id":"w4-integrate","title":"整合成本与差异","nodeIds":["w4-integrated","w4-flexibility"]}],"nodes":[{"id":"w4-business-strategy","title":"业务层战略与竞争定位","en":"Business-Level Strategy & Positioning","summary":"业务层战略是在特定产品市场中，协调承诺与行动、运用核心能力取得竞争优势的方式。","explanation":"战略涉及在两个或更多替代方案之间作选择。业务层战略是一套整合且协调的承诺与行动，企业用它在特定产品市场中运用核心能力取得竞争优势，也是每家企业必须形成的日常竞争核心战略。其目的在于使企业定位与竞争者不同：可用不同方式完成活动，也可选择不同活动。成功取决于把活动整合起来，为顾客创造更优价值。战略须符合内外环境现实、整合配置资源与能力，并与愿景和使命一致；课件还提出，企业可以通过战略影响环境。","bullets":["定义：在特定产品市场，运用核心能力取得竞争优势的一组整合、协调的承诺和行动。","每家企业都需要业务层战略，用它描述选定市场中如何与对手进行日常竞争。","定位区别的两条路径：以不同方式完成活动，或者完成不同的活动。","成功依靠活动之间的整合，为顾客创造优于竞争者的价值。","战略有明确目的、参与市场竞争，并体现对愿景和使命的共同理解。","内外匹配：配置资源、能力和核心能力以对接外部机会；企业的战略也可能影响环境。"],"example":{"label":"帮助理解的例子","text":"两家服务企业进入同一市场，一家调整所有流程以提高效率，另一家增加顾客重视的服务活动；二者选择了不同的竞争路径。"},"pitfall":"业务层战略不是一个口号或单一活动；核心在于特定产品市场内的一组相互协调的竞争行动。","sourcePages":[2,5,7,8,9,10]},{"id":"w4-digital-strategy","title":"数字战略：理解顾客再创新","en":"Digital Strategy","summary":"数字技术通过收集和分析信息，帮助企业理解顾客需要并创造更多价值。","explanation":"数字战略运用数字技术，帮助企业更清楚地理解顾客及其需要，并以此为基础创新、增加顾客价值。信息以及收集和分析信息的技术，是形成数字战略的核心。它与企业其他战略共同发展和实施，不能脱离具体竞争目标。课件以Netflix说明这条路径：观看数据、测试与机器学习帮助理解个人喜好和行为，再支持推荐、展示图片等个性化，以及内容决策，从而改善内容发现与参与体验。这是课件引用的案例，应理解为信息到顾客价值的连接。","bullets":["目标：更清楚地理解顾客与需要，以支持能创造更多价值的创新。","核心：信息本身，以及收集和分析信息的技术。","数字战略须与其他企业战略组合发展与实施。","Netflix案例使用观看数据、测试与机器学习，理解个人喜好和行为。","案例中的应用包括推荐与展示图片的个性化，以及内容决策，改善内容发现和参与体验。"],"example":{"label":"课件案例","text":"第6页引用Netflix推荐系统研究，说明观看数据、测试与机器学习如何支持个性化及内容决策，创造更好的发现与参与价值。"},"pitfall":"购买数字技术本身不等于形成数字战略；课件强调理解顾客、支持创新，并与其他战略共同实施。","sourcePages":[5,6]},{"id":"w4-source-gaps","title":"顾客与商业模式：课件边界","en":"Customers & Business Models — Source Coverage","summary":"本地课件列出了顾客及商业模式主题，但第11、12页均只有章节标题。","explanation":"学习目标要求讨论顾客与业务层战略的关系，提到who、what、how，也要求解释商业模式及其与业务层战略的关系。不过，本地Week4 PDF第11页只有顾客关系章节标题，第12页只有商业模式章节标题，没有展开定义、模型或详细论证。因此本知识图保留这些学习主题，并明确资料边界，不把通用教材补充写成老师课件结论。其余页面可以直接学习顾客价值、目标顾客、细分市场和不同竞争策略的关系；商业模式的具体定义与框架仍需另有课程材料才可确认。","bullets":["第3页学习目标4.2提到顾客关系的who、what、how，但该PDF未展开三者的具体内容。","第11页是“Customers: Their Relationship with Business-Level Strategies”的标题页。","第12页是“Business Models and Their Relationship with Business-Level Strategies”的标题页。","本地资料没有提供商业模式定义、分类或完整模型，不能从标题推导出课件结论。","可以从后续策略页核实目标顾客和顾客价值的区别；未展开主题保留为资料缺口。"],"example":{"label":"帮助理解的例子","text":"复习时可把“顾客关系的who／what／how”和“商业模式具体框架”列为待向课程其他材料核实的主题；这不是本课件已经给出的模型。"},"pitfall":"不能把商业模式、盈利模式或通用商业模式画布直接当成第12页教授过的内容。","sourcePages":[3,11,12]},{"id":"w4-cost-leadership","title":"成本领先：可接受特色与最低成本","en":"Cost Leadership Strategy","summary":"成本领先以相对竞争者最低的成本，提供顾客可接受的产品特色。","explanation":"成本领先是一套整合行动，用相对竞争者最低的成本，生产具有顾客可接受特色的产品。企业通常向行业中最典型的顾客出售标准化产品或服务，同时保留有竞争力的差异化水平。重点是持续把成本降到竞争者之下，而不是简单宣布低价。流程创新非常关键，新的生产与分销方法可以提高运营效率。企业既要考察主链中的物流活动，也要检查所有支持活动的降本机会。有效实施能让企业在强竞争力量下仍获得超额回报，但需要顾客继续接受产品。","bullets":["定义：提供顾客可接受的产品特色，并把成本控制在相对竞争者最低的水平。","典型对象：行业最常见的顾客；产品通常标准化，但保持有竞争力的差异化水平。","持续努力：不断降低相对竞争者的成本，以支持较低甚至最低的售价；成本优势与实际售价仍要分别判断。","流程创新：重新设计生产与分销方法和技术，提高效率。","降低成本时可重点关注进入与离开企业的物流，也要审视所有支持活动。","强竞争力量仍存在；成本优势帮助企业在这些压力下取得超额回报。"],"example":{"label":"课件案例","text":"第18页展示香港超市市场的研究标题与U购select、惠康、百佳、Market Place、759阿信屋和city'super图片。该页没有说明各品牌属于哪类战略，也没有展示成本或份额数据。"},"pitfall":"成本领先强调相对成本优势；低售价本身不能证明成本领先，标准化也不代表完全没有差异化。","sourcePages":[14,15,18]},{"id":"w4-cost-value-chain","title":"成本领先的价值链配置","en":"Value-Creating Activities for Cost Leadership","summary":"降本来自供应、运营、配送、营销、服务与支持职能的协调。","explanation":"Figure 4.2把成本领先落实到整条价值链。供应商关系支持投入品的有效流动，运营建立规模经济和高效率，分销选择低成本运输及配送时间地点，营销以高销量市场和低价促进销量，后续服务减少退货并鼓励复购。支持职能同样围绕效率：财务管理现金流与债务成本，人力资源提升招聘、保留和员工效率，信息技术支持高效运营，研发改善流程。图示说明成本优势需要多个环节共同支持，不能只靠某个部门压缩预算，也要保持顾客可接受的特色。","bullets":["供应链与运营：维护有效供应商关系及投入品流动，建立规模经济并追求最大运营效率。","分销：选择低成本运输模式、配送时间与地点，降低总体配送成本。","营销与后续服务：广告瞄准高销量市场，低价促进销量；有效服务减少退货并促进重复购买。","财务：管理资金以保持正现金流与较低债务成本。","人力资源：通过高效招聘、员工保留和培训控制成本并提高员工效率。","信息技术与研发：技术系统支持高效运营，流程研发提高产品或服务创造的效率。"],"example":{"label":"帮助理解的例子","text":"配送效率改善若与库存信息系统、供应商协作和运营流程配合，才能共同降低成本；单纯换成便宜运输并不等于整套战略已形成。"},"pitfall":"成本领先的研发并非消失，而是图示中强调流程开发与效率；支持职能也需要参与降本。","sourcePages":[15,16]},{"id":"w4-cost-five-forces","title":"成本领先如何面对五力","en":"Cost Leadership & the Five Forces","summary":"较低成本与较高利润空间，帮助企业应对现有对手、买方、供应商、进入者和替代品。","explanation":"成本领先的有利位置使对手较不愿以价格竞争；强买方仍能压价，但价格通常不会低于次高效率竞争者可获得平均回报的水平，除非成本领先者试图把它挤出市场。较大利润空间帮助应对供应商压力，强大的成本领先者也可能要求供应商维持低价。长期效率与经验形成进入壁垒，新进入者在追上效率前可能要承受低于平均回报。替代品出现时，成本领先者比竞争者更有降价空间以留住顾客。这些是相对优势，不代表竞争压力完全消失。","bullets":["现有对手：成本领先的位置让对手对价格竞争有所顾忌；对抗程度仍受企业规模、资源、市场依赖、地点、过去互动与顾客联系影响。","买方：强顾客可迫使降价；通常以次高效率竞争者仍能赚平均回报的水平形成约束，课件列出挤出该竞争者的例外。","供应商：成本领先者通常拥有较大利润空间；实力强时可能迫使供应商压低价格并减少供应商利润。","潜在进入者：效率和经验形成壁垒，进入者达到相近效率前可能接受低于平均回报。","替代品：比对手更有价格调整空间，可通过降价留住顾客。"],"example":{"label":"帮助理解的例子","text":"当替代产品吸引顾客时，成本更低的企业可能比高成本对手更有降价余地；这项余地来自成本位置，而非降价本身。"},"pitfall":"成本领先不能让强买方、供应商或替代品失去力量；它改善企业应对压力的相对位置。","sourcePages":[17,19,20]},{"id":"w4-cost-risks","title":"成本领先的三类风险","en":"Risks of Cost Leadership","summary":"新技术、被忽略的顾客需求变化和竞争者模仿，可能削弱成本优势。","explanation":"课件列出成本领先的三种竞争风险。第一，更新的技术可能令既有成本优势失效；第二，企业过于专注现有效率，可能未发现顾客需要已经改变；第三，竞争者可以通过自己的不同战略行动模仿成本领先者的优势。因此成本领先者需要不断降低相对成本，也要关注技术与顾客，而不能只沿用已经成功的生产方法。流程创新能改善生产与分销效率，但企业还须保持顾客可接受的产品特色。复习时要把相对成本位置、顾客需要与三项风险一起分析。","bullets":["更新技术可能夺走企业原有竞争优势。","企业可能未能察觉顾客需求变化。","竞争者可能通过自身不同的战略行动，模仿成本领先者的竞争优势。","持续降本应结合顾客可接受的产品特色，以及生产和分销流程创新。","风险分析须同时看相对竞争成本、顾客可接受的特色，以及流程创新能否继续支持效率。"],"example":{"label":"帮助理解的例子","text":"企业不断优化旧生产流程，却忽略顾客需要另一类产品；即使旧流程仍有效率，也可能无法继续提供顾客需要的价值。"},"pitfall":"成本领先的风险不只来自“别人也降价”；课件特别包含技术改变和未发现顾客需要改变。","sourcePages":[14,15,21]},{"id":"w4-differentiation","title":"差异化：顾客重视的不同","en":"Differentiation Strategy","summary":"差异化创造顾客认为重要的独特属性，使顾客愿意为额外价值支付溢价。","explanation":"差异化是一套整合行动，生产顾客认为在重要方面不同的产品。目标顾客重视独特特色多于低成本，额外价值来自产品属性而不是购买价格本身，因此愿意支付更高价格。产品创新是关键：创造或修改产品及服务来满足顾客需要。要持续成功，企业须不断升级顾客重视的差异特色，并在不显著增加成本的情况下创造新的有价值特色。企业可在多种维度形成差异，还要用价值链把所需活动连接起来。不同必须对目标顾客有意义，不能只是企业自认独特。","bullets":["定义：生产顾客感知为在重要方面不同的产品。","目标顾客：重视差异特色多于低成本，因独特属性带来的额外价值而愿付溢价。","关键能力：产品创新，创造新或修改后的产品／服务以满足顾客需要。","持续升级顾客重视的特色，同时创造新特色而不显著增加成本。","寻求在多个维度差异化，并用价值链连接创造这些价值所需的活动。"],"example":{"label":"帮助理解的例子","text":"顾客愿意为可靠的售后支持多付钱，售后特色才构成有意义的差异；企业增加顾客并不重视的装饰，不能据此证明可获得溢价。"},"pitfall":"不同本身不是差异化成功的证据；顾客须认为差异重要，而且愿为其额外价值付费。","sourcePages":[24,25]},{"id":"w4-diff-value-chain","title":"差异化的价值链配置","en":"Value-Creating Activities for Differentiation","summary":"高质量、灵活回应、便捷交付、顾客关系与售后服务，需要全链条支持。","explanation":"Figure 4.3显示差异化并不只发生在产品设计。供应链确保高质量投入品，运营制造高质量产品并灵活回应需求，分销准确及时且地点便利，营销建立顾客关系并传达理想产品形象，专门培训的售后团队提供信息和服务。支持职能包括对技术、创新产品、营销与服务的长期投资，高素质员工及培训，提供市场情报与实时信息的技术，以及根据市场情报发展的研发。企业须连接这些活动，才能持续提供顾客重视的独特价值，同时控制特色升级的成本。","bullets":["供应链与运营：维持良好供应商关系，取得高质量投入品，制造高质量产品并灵活回应需求变化。","分销：准确、及时交付，并位于对顾客方便的地点。","营销与服务：建立强健顾客关系、传递理想产品形象；以专门培训团队提供售后信息和服务。","财务：长期投资新技术、创新产品、营销及卓越服务能力。","人力资源：招募高素质员工，培训最新技术知识及提供卓越服务的能力。","信息技术与研发：提供及时市场情报和实时信息，再据此发展能差异化产品与服务的研发计划。"],"example":{"label":"帮助理解的例子","text":"高质量产品若配合准确送货和专业售后，顾客才可能持续感受到整体差异；只改广告形象却不协调实际活动，价值会受到限制。"},"pitfall":"差异化不等于只改品牌宣传；图示要求供应链、运营、配送、营销、服务及支持职能共同提供价值。","sourcePages":[25,26]},{"id":"w4-diff-five-forces","title":"差异化如何面对五力","en":"Differentiation & the Five Forces","summary":"有意义的差异带来顾客忠诚和较低价格敏感度，改善企业应对五力的位置。","explanation":"顾客若认为产品差异有意义，通常会更忠诚、对涨价较不敏感，这有助于减轻现有竞争压力。买方接受涨价的前提是产品仍满足独特需要且成本可接受；供应商成本上升则可以由较高利润吸收，或通过涨价转嫁给顾客。忠诚和产品独特性构成进入壁垒，进入者需要克服二者。面对替代品，品牌忠诚也降低顾客转向其他产品的可能。因而差异化的五力逻辑始终围绕顾客继续认可价值，而不是企业拥有一个品牌后就自动得到保护。","bullets":["现有对手：有意义的差异带来忠诚和较低涨价敏感度，帮助抵御竞争。","买方：只要仍感知产品以可接受成本满足独特需要，就较能接受涨价。","供应商：成本上升可以由企业较高利润吸收，或通过提高售价转嫁给顾客。","潜在进入者：顾客忠诚和克服独特产品的要求，共同形成较大壁垒。","替代品：向忠诚顾客出售品牌产品的企业，顾客转向替代品的概率较低。"],"example":{"label":"帮助理解的例子","text":"顾客持续重视某品牌的独特服务，可能较愿接受合理涨价；若独特需要已不再被满足，这层五力保护也会减弱。"},"pitfall":"较低价格敏感度不等于可以无限涨价；课件明确要求产品持续满足独特需要且成本仍可接受。","sourcePages":[27,28,29,31]},{"id":"w4-diff-risks","title":"差异化的价值与模仿风险","en":"Risks of Differentiation","summary":"当顾客不再认可溢价、对手以更低成本提供类似特色，或出现仿冒时，差异优势可能失效。","explanation":"差异化风险首先来自顾客价值判断：某群顾客可能认为独特特色不再值得溢价，产品也可能无法创造他们愿意多付钱的价值。其次，竞争者可能以更低成本提供类似特色，削弱产品的相对吸引力。仿冒也是课件列出的风险；此外，企业在实施差异化时可能未能满足顾客期望。因此企业需要持续升级顾客真正重视的特色，避免成本显著增加，并让实际体验符合承诺。差异化的保护来自持续的价值认可与忠诚，而不是一次产品创新或长期维持高价格。","bullets":["顾客决定产品独特特色不再值得支付溢价。","差异化产品未能创造顾客愿为之付溢价的那类价值。","竞争者以更低成本提供具有类似特色的产品。","Counterfeiting：仿冒削弱差异化优势。","企业实施差异化的努力未能满足顾客期望。","应持续更新顾客重视的特色，并控制新特色带来的成本增长。"],"example":{"label":"帮助理解的例子","text":"一项独特服务曾经值得溢价，但竞争者后来以更低成本提供类似服务，顾客可能重新评估额外价格是否值得。"},"pitfall":"差异化风险不只等于被模仿；即使没有模仿，顾客不再重视特色或实际体验不达期望，也会削弱优势。","sourcePages":[25,30]},{"id":"w4-focus","title":"聚焦：在窄市场选择两种优势","en":"Focused Cost Leadership & Focused Differentiation","summary":"聚焦服务特定细分市场，可采用聚焦成本领先或聚焦差异化，区别在竞争范围。","explanation":"聚焦战略以整合行动服务某一特定顾客细分市场。范围可按买方群体、产品线、地理区域或技术划分。第34页同时列出两项成功要求：服务需要足够专门、使面向整个行业的对手不选择服务的群体，并为该群体创造超过广泛竞争者的价值。优势来源仍有两种：聚焦成本领先和聚焦差异化。课件指出，它们所需活动以及应对五力的方式，分别与面向全行业的成本领先和差异化策略基本相同；主要区别是服务的竞争范围较窄，不能只因企业小就认定为聚焦。","bullets":["定义：生产满足特定顾客细分市场需要的产品的一套整合行动。","细分例子：老人等特定买方、专业油漆工产品等产品线、特定地区，以及AI或机器人等技术。","成功要求：服务专业化需要使广泛对手不选择服务的细分市场，并创造高于行业广泛竞争者的顾客价值。","Focused cost leadership：在狭窄市场运用成本领先的优势来源。","Focused differentiation：在狭窄市场运用差异化的优势来源。","两种聚焦策略所需活动与五力应对方式，分别与对应的全行业策略基本相同。"],"example":{"label":"课件案例","text":"第33页用老人、专业油漆工、意大利南部或北部，以及AI／机器人技术，说明企业可以采用的不同细分维度。"},"pitfall":"聚焦表示竞争范围较窄，不是第三种独立优势来源；仍须区分成本领先与差异化两种聚焦路径。","sourcePages":[33,34,35]},{"id":"w4-focus-risks","title":"聚焦的额外风险","en":"Risks of Focus Strategies","summary":"对手聚焦得更窄、大企业进入细分市场、需求差异缩小，都可能削弱聚焦优势。","explanation":"聚焦者保留对应成本领先或差异化策略的竞争逻辑，同时面临特定市场范围带来的风险。课件列出三种：竞争者利用核心能力服务一个更窄的细分市场，从而比原聚焦者更聚焦；面向整个行业的公司认为这个细分市场值得争夺并进入；狭窄群体的需求随时间变得更接近整个行业的需求。当专门化需要或服务优势不再明显，原来的聚焦位置就可能减弱。因此需要持续理解细分顾客，关注对手范围与需求变化，而不能认为市场较小便自然远离竞争。","bullets":["Out focus：竞争者利用核心能力服务更窄的市场，比原聚焦者更聚焦。","广泛竞争者进入：面向全行业的企业判断该细分市场有吸引力，决定竞争。","需求趋同：窄细分市场与整个行业顾客的需要差异，随时间缩小。","聚焦战略的对应活动和五力逻辑，与全行业策略基本相同，因此并不免除其原有风险。","聚焦优势仍须依靠特定顾客价值，不是单凭狭窄市场就能维持。"],"example":{"label":"帮助理解的例子","text":"原本服务所有专业使用者的企业，可能被专门服务其中某个职业群体的对手超越；后者以更窄范围更准确满足需要。"},"pitfall":"聚焦不保证免受广泛策略的风险，也不代表全球风险自然消失；第36页另列三项聚焦特有风险。","sourcePages":[34,35,36,37]},{"id":"w4-integrated","title":"整合成本领先／差异化","en":"Integrated Cost Leadership/Differentiation","summary":"同时配置主链与支持职能，提供相对低成本且带有顾客重视差异特色的产品。","explanation":"整合成本领先／差异化战略同时运用价值链活动和支持职能，达到低成本位置并提供一定产品差异。企业追求相对低成本、同时具有顾客重视特色的产品，成功者通常能迅速适应新技术及外部环境变化。因为要发展两种优势来源，企业需要在更多活动与支持职能中建立能力，并具有灵活性。主要风险是低成本和差异化两边都不足以提供价值，导致夹在中间。课件指出这种位置会使企业处于竞争劣势，并无法赚取高于平均水平的回报。","bullets":["双重目标：相对低成本，加上顾客重视的一些差异化特色。","实施对象：同时协调主要价值链活动与支持职能。","能力要求：两种优势来源增加了需要掌握的活动与职能数量。","适应性：成功实施者通常较快适应新技术与快速外部环境变化。","主要风险：低成本和差异化两方面提供的价值都不充分，成为stuck in the middle。","夹在中间的后果：处于竞争劣势，无法取得高于平均水平的回报。"],"example":{"label":"帮助理解的例子","text":"企业增加特色后成本过高，但特色又不足以让顾客多付钱，可能同时失去低成本与差异化价值，出现“夹在中间”的风险。"},"pitfall":"整合策略不是同时自称“最低价”和“最独特”；必须实际协调活动，给顾客足够的成本与差异价值。","sourcePages":[39,40,44,45]},{"id":"w4-flexibility","title":"三种灵活性来源","en":"FMS · Information Networks · TQM","summary":"柔性制造、信息网络与全面质量管理，帮助企业在差异特色和较低成本之间协调。","explanation":"整合战略需要灵活性，课件列出柔性制造系统、信息网络及全面质量管理三种来源。柔性制造是电脑控制、尽量减少人工介入的生产过程，可以用适中且灵活的数量制造多种产品，目标是消除传统低成本与多品种之间的取舍。信息网络连接供应商、分销商与顾客，支持质量与交付速度；CRM是管理顾客关系的网络过程。全面质量管理用适当工具提供高质量产品和服务，以提升满意度、降低成本并缩短创新上市时间，也帮助同时寻找差异化与降本机会。","bullets":["FMS：电脑控制、最少人工介入，以适中且灵活的数量生产多种产品。","FMS作用：快速切换产品、以低成本和稳定质量回应需求、降低有效生产所需批量，并服务窄范围独特需要。","Information networks：连接企业与供应商、分销商和顾客，支持产品质量与交付速度。","CRM：企业用来管理顾客关系的一种信息网络过程。","TQM：实施适当工具和技术，向顾客提供高质量产品与服务。","TQM目标：提高顾客满意度、降低成本、缩短创新产品上市时间，并识别同时提升差异特色和降本的机会。"],"example":{"label":"帮助理解的例子","text":"生产线能快速转换产品，企业就可能用较小批量回应不同需要；再配合信息共享与质量管理，支持整合战略所需的灵活性。"},"pitfall":"三者是支持灵活性与整合战略的系统，不是只要购买系统就自动获得两种竞争优势；还须学会协调主链和支持职能。","sourcePages":[40,41,42,43]}],"quiz":[{"id":"w4-q1","nodeId":"w4-business-strategy","question":"业务层战略的核心含义是哪一项？","options":["在特定产品市场运用核心能力，通过协调承诺与行动取得竞争优势","只要设定公司收入目标","只决定公司拥有多少不同业务","只改变一项广告活动"],"answer":0,"explanation":"第8页定义业务层战略为整合、协调的承诺与行动，在特定产品市场利用核心能力获取竞争优势；第9页强调活动整合。","sourcePages":[8,9]},{"id":"w4-q2","nodeId":"w4-cost-leadership","question":"哪一项准确描述课件中的成本领先？","options":["完全取消产品的所有差异特色","相对竞争者最低成本，提供顾客可接受的特色","售价最低便必然具有最低成本","只为一个狭窄顾客群服务"],"answer":1,"explanation":"第14页强调相对竞争者最低成本与顾客可接受特色；产品通常标准化，但保留有竞争力的差异化水平。","sourcePages":[14]},{"id":"w4-q3","nodeId":"w4-diff-five-forces","question":"顾客对有意义的差异化品牌越忠诚，通常会怎样？","options":["对涨价更敏感","完全不考虑产品是否满足需要","对涨价较不敏感","必然拒绝所有涨价"],"answer":2,"explanation":"第27页指出有意义的差异会形成忠诚和较低涨价敏感度；第28页的接受涨价前提是仍满足独特需要且成本可接受。","sourcePages":[27,28,31]},{"id":"w4-q4","nodeId":"w4-focus-risks","question":"哪一项是课件列出的聚焦战略风险？","options":["细分市场越窄就完全没有竞争","大企业绝不会进入狭窄市场","聚焦自动免除所有全行业策略风险","对手服务更窄细分市场，从而比原聚焦者更聚焦"],"answer":3,"explanation":"第36页的第一项风险是竞争者用核心能力服务更窄市场而out focus原聚焦者；另两项是广泛对手进入与需求差异缩小。","sourcePages":[36]},{"id":"w4-q5","nodeId":"w4-integrated","question":"整合成本领先／差异化战略“夹在中间”的主要原因是什么？","options":["同时使用信息网络与质量管理","低成本与差异化两方面都没有提供足够价值","在更多活动中建立能力","适应新技术速度较快"],"answer":1,"explanation":"第44页指出，产品在低成本或差异化方面都无法提供足够价值，会让企业stuck in the middle，处于竞争劣势且无法取得超额回报。","sourcePages":[44]}],"shortTitle":"业务层战略","englishShort":"Business strategy","mapQuestion":"选择怎样的方式去竞争？","color":"#6d87c0","tint":"#f0f4fc","border":"#d7e1f3","icon":"flag","pageCount":46,"originalName":"MGT4001 Week4_Post.pdf","number":4,"file":"week4.pdf"},{"id":"w5","title":"第5章 · 竞争对抗与竞争动态","subtitle":"把战略放进对手会行动、会回应的市场中","question":"当我采取竞争行动时，谁可能回应、为什么回应、会多快回应？","takeaway":"先分析共同市场与相似资源，再用认知、动机、能力判断行动和回应；优势能持续多久，取决于市场中的模仿速度与成本。","groups":[{"id":"w5-g-concepts","title":"先辨清竞争的观察层次","nodeIds":["w5-concepts","w5-actions","w5-nonmarket"]},{"id":"w5-g-analysis","title":"认识具体对手","nodeIds":["w5-analysis","w5-commonality","w5-similarity"]},{"id":"w5-g-attack","title":"解释企业为什么出招","nodeIds":["w5-amc","w5-first-mover","w5-followers","w5-size-quality"]},{"id":"w5-g-response","title":"预测对手会不会回击","nodeIds":["w5-response-triggers","w5-response-factors"]},{"id":"w5-g-cycles","title":"判断优势如何随时间变化","nodeIds":["w5-slow-cycle","w5-fast-cycle","w5-standard-cycle"]}],"nodes":[{"id":"w5-concepts","title":"竞争者、对抗、行为与动态","en":"Competitors, Competitive Rivalry, Behavior & Dynamics","summary":"同一市场的直接对手相互出招，单家企业的行为汇集成整个市场的竞争动态。","explanation":"竞争者是在同一市场提供相似产品、面向相似顾客的企业。竞争对抗指企业为取得有利市场位置而进行的行动与回应；竞争行为是某一家企业为建立或保卫优势、改善市场位置而采取的一组行动和回应；竞争动态则把镜头拉远，观察同一市场所有企业的行动与回应总和。课件图5.1把这些层次串起来：对手参与对抗，借助竞争行为争取位置，最终形成市场动态。战略成败既取决于自己的初始行动，也取决于能否预判和应对对手。","bullets":["竞争者的识别同时看市场、产品与目标顾客。","Rivalry关注企业与直接对手之间持续的互动。","Behavior以单家企业为观察单位；Dynamics以市场内所有企业为观察单位。","竞争对抗影响各种战略，尤其影响业务层战略。","供应商等生态系统成员也会通过提供创新所需的投入影响产业演变。"],"example":{"label":"课件案例","text":"p20中MarblemawTech面向家庭用户销售和支持电脑，Fellowes Networks面向企业提供网络及软硬件服务。虽然都涉及电脑业务，目标顾客和服务市场不同，因此不太可能构成课件定义中的直接竞争对抗。"},"pitfall":"不能仅因两家企业属于同一大行业，就认定它们是直接竞争者；也不能把某一家企业的行动集合称为整个市场的竞争动态。","sourcePages":[4,5,6,7,8,20,43]},{"id":"w5-actions","title":"行动与回应：战略还是战术？","en":"Strategic and Tactical Actions & Responses","summary":"行动和回应按目的区分，战略和战术按资源承诺及实施、逆转难度区分。","explanation":"竞争行动旨在建立或保卫竞争优势、改善市场位置；竞争回应旨在抵消竞争者行动带来的影响。两者都可能具有战略性或战术性，因此要用两条不同的判断轴。战略行动或回应投入大量组织资源，实施困难且不易逆转；战术行动或回应主要微调现有战略，资源投入较少，实施和逆转相对容易。判断时应先问这一步是否为了抵消对手，再看投入和可逆性，不能只根据动作听起来多么重要，或由谁首先提出，来贴标签。","bullets":["竞争行动：建立或保卫优势，或改善市场位置。","竞争回应：抵消竞争者行动的效果。","战略性举措：资源承诺大，实施与逆转困难。","战术性举措：微调战略，资源投入少，相对易实施和逆转。","同样的降价或产品调整，要结合具体规模和承诺判断。"],"example":{"label":"课件案例","text":"p14让经营者设想用特殊French Pot工艺的本地冰淇淋公司如何与全国连锁竞争。这是开放判断情境：需要补充拟采取的动作及投入，才能确定属于主动行动还是回应，以及属于战略性还是战术性举措。课件没有给出唯一标准动作。"},"pitfall":"“回应”不等于“战术”：为抵消对手而新建大型工厂，也可能是战略回应。","sourcePages":[10,14]},{"id":"w5-nonmarket","title":"非市场战略：改变制度环境","en":"Non-market Strategies","summary":"企业除了在产品和价格上竞争，也可能尝试改变约束竞争的制度与规范。","explanation":"非市场战略以改变企业的制度环境作为竞争战略的一部分。制度环境包括政府制定的正式规则，例如约束某一市场或整个行业的法规，也包括市场或行业中普遍存在的非正式规则和规范。新规一旦成立，相关企业就必须遵守，否则承担后果。因此，企业的竞争位置不仅由市场内的产品、价格和服务举措决定，还会受到游戏规则的影响。分析时要区分面向顾客的市场行动与面向制度的非市场行动，并思考改变后的规则会如何影响各家企业。","bullets":["核心对象是institutional environment，即制度环境。","正式规则包括政府法规及其他影响竞争的要求。","非正式规则包括行业或市场中占主导地位的规范。","作用机制是影响竞争的规则，进而影响企业的市场行为。"],"example":{"label":"帮助理解的例子","text":"假设咖啡行业协会倡议一套顾客可识别的环保包装规范，希望它成为行业惯例。这种面向行业规范的行动可用来理解非市场战略；门店同时推出环保杯折扣，则是面向顾客的市场行动。"},"pitfall":"“非市场”并不表示没有竞争目的，也不只指政府法规；行业中的非正式规范同样属于制度环境。","sourcePages":[6,11]},{"id":"w5-analysis","title":"竞争者分析与互动反馈","en":"Competitor Analysis & Rivalry Model","summary":"预测对手之前，要分析其目标、战略、假设和能力，并把竞争结果反馈到分析中。","explanation":"竞争者分析是预测对手行动与回应的第一步，关注未来目标、当前战略、假设和能力。缺少这些信息容易形成竞争盲点，例如误判对手愿意守住哪个市场，或低估它可以调动的资源。图5.2将分析展开为连续过程：市场共同性和资源相似性影响认知、动机、能力；这些驱动因素连同具体行动与回应条件影响竞争对抗；对抗产生市场位置与财务表现结果，再反馈到竞争者分析。由此可见，企业之间相互依赖，分析也应随着互动结果更新。","bullets":["未来目标：对手希望达到什么结果？","当前战略：它现在怎样竞争？","假设：它如何理解自己、对手和行业？","能力：它具备哪些可用于行动和回应的资源？","反馈结果包括市场位置与财务表现，帮助修正下一轮预测。"],"example":{"label":"帮助理解的例子","text":"校园咖啡店判断连锁店会否跟进早餐套餐时，可以检查连锁的增长目标、当前套餐战略、对学生需求的判断及厨房能力。活动后再观察销量和对手动作，更新判断。"},"pitfall":"只搜集对手已经做过的动作仍不够；忽略它的目标、假设或能力，仍可能形成竞争盲点。","sourcePages":[12,13,16,17]},{"id":"w5-commonality","title":"市场共同性与多点竞争","en":"Market Commonality & Multipoint Competition","summary":"市场共同性同时衡量双方重叠市场的数量，以及各市场对双方的重要程度。","explanation":"市场共同性并非简单问两家公司是否卖同类产品，而是看它们共同参与多少市场，以及这些市场分别有多重要。企业若在多个产品市场或地理市场相遇，就形成多点竞争。课件指出，多点竞争一般会降低竞争对抗，因为相互依赖跨越了多个市场；但这并不是绝对规则，若潜在收益很高，例如可获得较大市场份额，企业仍可能发动攻击。把共同性放进分析时，应该同时记录重叠的范围和重要程度，避免把一次局部交锋孤立地理解。","bullets":["共同性包含两个维度：共同市场数量、各市场对双方的重要性。","多点竞争可以发生在不同产品市场或不同地理市场。","多点竞争一般降低竞争对抗，但高潜在收益仍可能促使攻击。","与资源相似性一起构成竞争者分析的基础。"],"example":{"label":"帮助理解的例子","text":"两家咖啡连锁若同时在校园、商场和办公区竞争，属于多点竞争。分析不能只数三个市场，还要问校园业务是否是其中一家最重要的收入来源。"},"pitfall":"高市场共同性不等于一定打得更激烈；课件对多点竞争的总体判断是降低对抗，同时保留高收益情况下的攻击可能。","sourcePages":[5,18,22]},{"id":"w5-similarity","title":"资源相似性与资源差异","en":"Resource Similarity & Dissimilarity","summary":"资源相似性比较双方有形和无形资源的类型与数量，影响优势、战略和回应速度。","explanation":"资源相似性是企业与对手的有形及无形资源，在类型和数量上可比的程度。拥有相似资源的企业通常具有相近的优势与弱点，也可能采用相似战略去追求外部环境中的相似机会。相反，资源差异会改变双方可采取的行动与回应；课件指出，资源差距越显著，处于资源劣势的企业回应延迟越长。这不意味着弱者可以永远不行动：即使对手资源更丰富或位置更有利，企业仍需考虑最终如何回应，因为长期不回应可能导致失败。","bullets":["比较对象包括有形资源与无形资源。","比较维度同时包括资源类型和资源数量。","相似资源常带来相似优势、弱点及战略选择。","资源劣势可能使回应延迟，差距越大，延迟越长。","不能把回应延迟直接解释为没有意愿回应。"],"example":{"label":"帮助理解的例子","text":"两家门店拥有相近设备、资金、员工技能和品牌认知，可用于理解高资源相似性。若其中一家缺少资金，即使非常想跟进对手扩店，也可能需要更长时间筹措资源。"},"pitfall":"市场重叠回答“在哪里相遇”，资源相似性回答“用什么、拥有多少”；两者不能互相替代。","sourcePages":[19,22,24]},{"id":"w5-amc","title":"AMC：认知、动机、能力","en":"Awareness, Motivation & Ability","summary":"预测竞争行为要同时问企业是否理解相互依赖、是否愿意行动，以及是否具备可用能力。","explanation":"认知衡量竞争者在多大程度上理解彼此的相互依赖；当企业资源高度相似、又在多个市场相互竞争时，认知通常最强。动机是采取行动或回应攻击的激励；如果企业认为不回应也不会改善或损害自己的位置，就可能缺少竞争动机。能力关注可用于攻击和回应的资源质量；没有资金、人员等可用资源，企业便无法攻击或回应。AMC把对手信息转换为行为预测，三个维度须结合判断，不能因对手已经察觉威胁，就直接推定它一定愿意或能够回击。","bullets":["Awareness：是否认清双方的相互依赖。","Motivation：行动或回应有何激励。","Ability：是否拥有可用且适合行动的资源。","市场共同性与资源相似性会塑造这些驱动因素。","回应较慢可能是资源不足，不能仅凭结果判断动机。"],"example":{"label":"帮助理解的例子","text":"某咖啡店知道隔壁在抢早餐客流，说明它察觉了相互影响；早餐又占其主要收入，提供回应动机；但只有一名员工，无法延长营业时间，则限制了回应能力。"},"pitfall":"认知、动机和能力是三个不同问题；“看见竞争动作”“想回应”“有资源回应”不能混为一谈。","sourcePages":[13,22,23,24]},{"id":"w5-first-mover","title":"先行者：抢先行动的收益与条件","en":"First-Mover Benefits & Organizational Slack","summary":"先行者通过初始竞争行动争取优势，但需要创新投入、可用资源和合理的风险承担。","explanation":"先行者是首先采取某项竞争行动，以建立或保卫优势、改善市场位置的企业。它常强调研发和顾客重视的创新产品，在对手回应之前可能获得超额回报、顾客忠诚与市场份额。先行收益在技术变化快、产品生命周期短的行业尤其关键。成为先行者也需要条件：足够资源支持研发，并快速、成功地生产和营销连续创新。组织冗余是超过维持一定产出最低需求、当前未使用但实际拥有或可取得的资源缓冲，它使抢先行动更可行。","bullets":["先行者是相对于某项竞争行动而言，未必是最早成立的企业。","常借助研发创造顾客重视的创新。","可能在对手回应前取得回报、忠诚与市场份额。","通常积极进取、愿意试验，并承担较高但合理的风险。","组织冗余可支持持续研发与快速生产、营销。"],"example":{"label":"帮助理解的例子","text":"咖啡店率先推出需要设备和培训的新饮品，可先获得尝鲜顾客。但只有足够资金、熟练员工和营销能力，才有条件稳定推出后续产品；闲置可用资源可形成组织冗余。"},"pitfall":"先行收益不是成功保证；“最先行动”描述竞争时序，不能单独证明企业必然获胜。第34页虽询问快周期市场中先行者的生存率与收入，但本地课件未提供答案，也没有展开相应证据，不能据此断言先行者与第二行动者的生存率高低。","sourcePages":[26,27,28,29,34]},{"id":"w5-followers","title":"第二行动者与迟行动者","en":"Second Movers & Late Movers","summary":"第二行动者学习并改进先行者的举措，迟行动者则在较长延迟后才回应。","explanation":"第二行动者回应先行者的竞争行动，通常采用模仿。它可以观察顾客反应，找出先行者的错误并避免重犯，还能利用额外时间开发更高效的流程或技术，为顾客创造更多价值。因此，第二行动者的价值不只是复制，而是学习后适时改进，最成功者通常既不太快也不太慢。迟行动者在先行者行动及第二行动者回应之后，经过较长时间才采取回应。课件认为它通常较不成功，并需要较长时间理解如何提供至少相当的顾客价值。","bullets":["第二行动者通常通过模仿回应先行者。","可研究顾客反应，避免先行者已经暴露的错误。","可改进流程、技术效率及顾客价值。","成功的跟进节奏通常避免过快和过慢。","迟行动者回应明显延后，通常比前两类取得较少成功。"],"example":{"label":"帮助理解的例子","text":"第一家咖啡店推出订阅套餐后，第二家观察到顾客不喜欢固定饮品，便推出可换品种的套餐。第三家很久之后才复制原版，还需追赶前两家的顾客价值。"},"pitfall":"第二行动者不是机械复制者；迟行动者“通常较不成功”也不意味着所有迟行动者都会失败。","sourcePages":[30,31]},{"id":"w5-size-quality","title":"组织规模与质量门槛","en":"Organizational Size & Quality","summary":"规模影响行动速度、数量和类型，质量则以顾客重视的期望与维度为标准。","explanation":"组织规模影响企业是否采取竞争行动，以及行动的类型和时机。小企业通常更可能出招且更快，凭灵活性、速度、出其不意及多样行动维护优势。大企业通常拥有更多冗余资源，因此在一定时期内可发动更多总行动和战略行动。质量是产品达到或超过顾客期望的程度，顾客会按照自己重视的多种表现维度判断；至少满足基本质量期望，才可能购买产品或使用服务。因而不能只比较规模大小，也要判断行动能否跨过顾客的质量门槛。","bullets":["小企业：更可能行动、更快行动，灵活且善用速度和突然性。","大企业：通常冗余资源更多，可开展更多总行动和战略行动。","行动概率、行动速度与行动总数是不同指标。","质量以顾客期望及顾客重视的表现维度衡量。","基本质量要求未满足时，顾客可能根本不会购买。"],"example":{"label":"帮助理解的例子","text":"小咖啡店能迅速测试周末饮品，大连锁则能同时改装许多门店。两者都要满足目标顾客对口味、等待时间或服务的基本期望；这些质量维度由顾客重视什么决定。"},"pitfall":"“小企业更快、更可能出招”与“大企业总行动更多”不矛盾；高售价或复杂工艺也不自动等于顾客感知的高质量。","sourcePages":[26,32,33]},{"id":"w5-response-triggers","title":"什么威胁会触发回应？","en":"Likelihood of Response: Threats to Advantage","summary":"对手优势变强、自己的核心能力受损，或市场位置更难防守，都会提高回应的可能性。","explanation":"课件列出三类通常会提高回应可能性的情况：竞争行动使对手更好地运用其能力、形成更强优势或改善位置；行动损害本企业利用核心能力建立或维持优势的能力；本企业的市场位置因此更难防守。关键在于行动的实际影响，而不是动作本身是否引人注目。预测时应先解释威胁沿哪条路径发生，再把它与认知、动机和能力结合判断。由于企业相互依赖，一项看似局部的举措也可能改变另一家的价值创造条件，引出后续回应。","bullets":["对手更有效地运用能力，形成更强竞争优势。","本企业使用核心能力创造或维持优势受到损害。","本企业的市场位置变得更难保卫。","是否受威胁与是否有能力回应，需要分别判断。"],"example":{"label":"帮助理解的例子","text":"一家咖啡店以快速外卖见长。若对手的预订取餐服务显著缩短等待时间，既增强对手优势，又削弱本店原有便利性优势，因此可预期本店更有回应动机。"},"pitfall":"“受到威胁”提高回应可能性，不表示一定立即回应；能力不足或实施难度仍可能影响时机。","sourcePages":[12,23,36,37]},{"id":"w5-response-factors","title":"回应强弱：行动类型、声誉、市场依赖","en":"Action Type, Actor’s Reputation & Market Dependence","summary":"预测回应需看动作是否易跟进、行动者的历史声誉，以及被攻击市场对对手有多重要。","explanation":"企业一般采取的战术回应多于战略回应，因为战略回应耗费大量资源、难以实施和逆转；实施战略行动和评估效果所需的时间，也可能延迟对手回应。课件进一步指出，对手通常会快速回应战术行动，但若战略行动对本企业影响重大，回应仍可能迅速而强烈。声誉是对手依据过去竞争行为赋予行动者的正面或负面属性：市场领导者的动作更容易引发回应，行为冒险、复杂且难预测者的动作较不易引发回应。市场依赖指收入或利润来自某一市场的程度；依赖越高，面对威胁该市场位置的攻击，通常回应越强。","bullets":["一般而言，战术回应数量多于战略回应；对手通常快速回应战术行动，战略回应则投入大、实施难。","战略攻击若影响显著，回应也可能迅速且强烈。","市场领导者采取动作时，其他竞争者更可能回应。","冒险、复杂、不可预测的行为声誉通常降低对手回应可能性。","高度依赖某市场收入或利润的企业，通常强烈回应该市场的威胁。"],"example":{"label":"帮助理解的例子","text":"假设A店八成利润来自校园市场，而B连锁的校园店只占很少利润。面对同样的校园促销攻击，A通常有更强的回应动机；这是市场依赖差异，不是市场份额差异。"},"pitfall":"市场依赖不是市场占有率；“战略回应通常较慢”也有重大影响下迅速强烈回应的例外。","sourcePages":[37,38,39,40,41]},{"id":"w5-slow-cycle","title":"慢周期市场：保护较持久的优势","en":"Slow-Cycle Markets","summary":"当模仿能力受限且模仿成本高时，企业可较长时间保护、维持和扩展独特优势。","explanation":"慢周期市场中，竞争者难以模仿焦点企业的优势，即使能够模仿，成本也较高，所以优势通常可以持续较长时期。独特而专有的能力成为成功基础，企业行动与回应多围绕保护、维持和扩展这种优势，重大战略行动通常比更快周期市场风险低。企业先推出依靠专有优势开发的产品，再利用产品独特性尽可能久地获取收益。图5.3显示，竞争者最终反击时，优势回报仍会逐渐被侵蚀；较持久并不意味着永久不受竞争影响。","bullets":["区分标准：对手模仿能力有限，模仿成本高。","独特、专有的能力有利于较长期维持优势。","行动重点是保护、维持并扩展既有优势。","产品推出后先利用优势，最终仍可能面对对手反击。","图中的时间刻度用于说明侵蚀过程，不能当作所有行业的固定年限。"],"example":{"label":"帮助理解的例子","text":"设想一家企业拥有对手难以取得或复制的专有技术。它可较久利用该技术，但仍需保护能力并留意替代技术出现。这个假设用于解释慢周期，不是课件对咖啡行业的分类。"},"pitfall":"“慢周期”指竞争优势的模仿速度与成本，不是企业销售增长慢，也不是优势永远不会消失。","sourcePages":[43,44,45,46]},{"id":"w5-fast-cycle","title":"快周期市场：连续创造临时优势","en":"Fast-Cycle Markets","summary":"当模仿迅速且便宜时，持续竞争依赖在旧优势消失前接上新的临时优势。","explanation":"快周期市场中，形成优势的能力常被竞争者迅速且低成本地模仿，技术快速扩散，逆向工程也可帮助取得模仿或改进产品所需的知识。较快变化给管理者带来快速有效决策的压力。企业因此要培养能够连续、快速产生新优势的能力与核心能力：推出产品，尽量利用当前优势，并在竞争者回应前发展下一项优势。图5.4的多条重叠曲线表达的，是一系列可被模仿的临时优势接续；持续性来自不断更新，而非某个产品始终领先。","bullets":["模仿通常迅速、成本低，技术扩散快。","所用技术常不是专有技术，也未受专利保护。","逆向工程有助于快速获得模仿或改进所需知识。","管理者需快速、有效地作战略决策。","在对手回应当前产品前，积极发展下一项竞争优势。"],"example":{"label":"帮助理解的例子","text":"设想某饮品配方一推出就能被同行快速复制。门店若只守住这一款，优势容易消失；持续改进配方、服务和推出节奏，才可能不断形成下一项临时优势。"},"pitfall":"快周期中的“持续优势”不是单一优势不会被模仿，而是企业有能力让多项临时优势连续接续。","sourcePages":[43,47,48,49,52]},{"id":"w5-standard-cycle","title":"标准周期市场：规模、品牌与能力升级","en":"Standard-Cycle Markets","summary":"中等模仿成本使优势部分可持续，但企业必须持续升级能力并争取规模与顾客忠诚。","explanation":"标准周期市场中，部分竞争者能够模仿焦点企业的优势，但模仿成本适中；模仿比慢周期更快、更便宜，比快周期更慢、更昂贵。优势只能部分持续，而且以企业不断提高能力质量为条件，渐进式和突破式创新都很重要。企业模仿行动与回应以争取较大份额、通过品牌建立顾客忠诚，并仔细控制运营。由于销量大、大众市场规模大且需要规模经济，市场份额争夺激烈。因此，保护现有位置和不断升级能力需要同时进行。","bullets":["区分标准：部分对手可以模仿，模仿成本适中。","优势部分可持续，条件是持续升级能力质量。","渐进创新与突破式创新均影响战略竞争力。","争取大份额、品牌忠诚和谨慎运营控制。","大销量、大众市场与规模经济需求使份额竞争激烈。"],"example":{"label":"帮助理解的例子","text":"设想一家连锁的配方能被模仿，但要复制品牌、供应链和一致服务需要中等投入。企业便需持续提升这些能力，同时争取顾客忠诚和规模。此情境用于理解标准周期的机制。"},"pitfall":"三类周期的界线在模仿速度和成本，不能仅依据产品生命周期长短或行业名称分类。","sourcePages":[43,50,51]}],"quiz":[{"id":"w5-q-dynamics","nodeId":"w5-concepts","question":"把同一市场中所有企业的竞争行动与回应作为整体观察，最准确的概念是什么？","options":["竞争动态（Competitive dynamics）","一家企业的竞争行为（Competitive behavior）","市场依赖（Market dependence）","组织冗余（Organizational slack）"],"answer":0,"explanation":"p5与p43将竞争动态定义为同一市场中所有企业的竞争行动与回应总和；竞争行为以单家企业为观察单位。p8的原课件知识检查也考查这一层次区分。","sourcePages":[5,8,43]},{"id":"w5-q-amc","nodeId":"w5-amc","question":"一家门店明确知道对手抢走核心顾客，也很想回应，但缺少资金和人员。哪项AMC因素最直接限制了它的行动？","options":["认知，因为它没有注意到相互依赖","动机，因为它完全不想保住顾客","能力，因为缺少可用于回应的资源","市场共同性，因为双方必然不在同一市场"],"answer":2,"explanation":"p23指出能力涉及可用资源的质量，缺少资金和人员等资源就不能进行攻击或回应。题目已经提供认知和动机，直接限制是能力。此门店情境为帮助理解而编写。","sourcePages":[22,23,24]},{"id":"w5-q-action","nodeId":"w5-actions","question":"为抵消对手进入新区域的影响，企业投入大量资源建设新工厂，且建设不易逆转。这最适合归类为什么？","options":["战术行动，因为所有建设都只是微调","战略回应，因为它抵消对手且资源承诺大、难逆转","非市场战略，因为它没有顾客","竞争动态，因为只有一家企业参与"],"answer":1,"explanation":"p10分别用目的和资源承诺区分动作：抵消对手行动属于回应，大量投入且实施、逆转困难属于战略性举措，因此是战略回应。工厂情境为教学示例。","sourcePages":[10]},{"id":"w5-q-dependence","nodeId":"w5-response-factors","question":"企业收入或利润来自某一特定市场的程度，课件称为什么？","options":["市场领导地位","资源相似性","市场支配","市场依赖"],"answer":3,"explanation":"p40将市场依赖定义为企业从某一市场取得收入或利润的程度，并指出高度依赖者通常强烈回应威胁该市场位置的攻击。它与市场占有率或领导地位并非同一概念；p41考查该定义。","sourcePages":[40,41]},{"id":"w5-q-cycle","nodeId":"w5-fast-cycle","question":"对手能迅速且低成本模仿，企业需要在旧优势被回应前发展下一项优势。这是哪种市场的典型动态？","options":["慢周期市场","标准周期市场","快周期市场","只要企业规模大，三者完全一样"],"answer":2,"explanation":"p47定义快周期市场为模仿迅速且成本低；p48要求连续发展新优势，p49以重叠的临时优势曲线说明接续机制。慢周期模仿困难且昂贵，标准周期模仿成本居中。","sourcePages":[44,47,48,49,50,52]}],"shortTitle":"竞争互动与动态","englishShort":"Competitive dynamics","mapQuestion":"采取行动后，对手如何回应？","color":"#b781a1","tint":"#faf0f6","border":"#ebd5e2","icon":"activity","pageCount":53,"originalName":"MGT4001 Week5_Post.pdf","number":5,"file":"week5.pdf"}],"links":[{"to":"w2-layers","reason":"战略分析首先需要外部信息","description":"A–S–P 中的分析 A 要研究宏观、行业和直接竞争者。三个层次的信息共同支持机会与威胁的判断。","featured":true,"from":"w1-process"},{"to":"w2-attractiveness","reason":"五力具体回答行业是否有吸引力","description":"I/O 模型从外部条件出发，第二章五力将行业盈利压力拆成五个来源。先判断行业，再判断应该采用什么竞争方式。","featured":true,"from":"w1-io"},{"to":"w3-core-competencies","reason":"资源基础模型在内部分析中展开","description":"资源基础模型从企业差异出发。第三章把资源组合成能力，再识别哪些能力能创造独特顾客价值。","featured":true,"from":"w1-rbv"},{"to":"w3-vrin","reason":"同一资源判准，在第三章细化","description":"第一章简要介绍资源判准，第三章深入讲有价值、稀缺、难以模仿和不可替代。保留 VRIN 与 VRIO 的区别。","featured":true,"from":"w1-vrin"},{"to":"w4-business-strategy","reason":"外部机会要与自身能力匹配","description":"有吸引力的行业只是外部线索。业务层战略还要在特定产品市场运用核心能力，才能形成适合自己的竞争定位。","featured":true,"from":"w2-attractiveness"},{"to":"w4-business-strategy","reason":"能力决定战略能否落地","description":"选择竞争方式时，需要检查能否用已有或能发展出的核心能力支持价值创造。竞争定位与能力配置应相互匹配。","featured":true,"from":"w3-core-competencies"},{"to":"w4-cost-value-chain","reason":"同一价值链可以为降本服务","description":"价值链分析先找出哪些活动创造价值、哪里存在弱项；成本领先再把采购、运营、分销等活动配置为较低成本的系统。","featured":true,"from":"w3-value-chain"},{"to":"w4-differentiation","reason":"顾客重视的价值支持差异化溢价","description":"差异化需要顾客认为有意义的不同。内部能力产生的特色，只有被顾客重视时，才可能支持他们支付更高价格。","featured":true,"from":"w3-value-judgment"},{"to":"w5-analysis","reason":"竞争者画像支持行动与回应预测","description":"第二章关注目标、现有战略、假设、能力。第五章进一步关注市场共同性和资源相似性，把画像用于分析互动。","featured":true,"from":"w2-competitor"},{"to":"w5-amc","reason":"想回应，还要具备回应能力","description":"AMC 的能力 A 关心企业是否拥有行动所需资源。资源与能力分析可以帮助判断竞争者即使想回应，是否真的做得到。","featured":true,"from":"w3-capabilities"},{"to":"w5-actions","reason":"战略定位通过具体行动实现","description":"第四章选择怎么竞争，第五章观察这一选择怎样表现为投入、市场进入或促销，以及对手会作出什么战略或战术回应。","featured":true,"from":"w4-business-strategy"},{"to":"w5-fast-cycle","reason":"优势持续性取决于模仿与更新","description":"当模仿快速而便宜，单一优势会很快消失。企业需要连续发展新优势，并根据竞争结果再次分析环境与自身能力。","featured":true,"from":"w1-advantage"},{"to":"w4-business-strategy","reason":"总体选择落实到产品市场的竞争方式","description":"","featured":false,"from":"w1-strategy"},{"to":"w3-internal-fit","reason":"内部分析是 A 阶段的另一部分","description":"","featured":false,"from":"w1-process"},{"to":"w5-analysis","reaso from":"w3-value-chain"},{"to":"w4-flexibility","reason":"信息网络等支持系统可帮助兼顾成本和差异","description":"","featured":false,"from":"w3-support-functions"},{"to":"w4-differentiation","reason":"两者创造竞争优势的主要方式不同","description":"","featured":false,"from":"w4-cost-leadership"},{"to":"w4-focus-risks","reason":"窄市场仍有需求变化与竞争进入风险","description":"","featured":false,"from":"w4-focus"},{"to":"w4-flexibility","reason":"整合战略需要能同时支持两类目标的灵活性","description":"","featured":false,"from":"w4-integrated"},{"to":"w5-response-factors","reason":"目标细分市场的重要性影响对手回应动机","description":"","featured":false,"from":"w4-focus"},{"to":"w5-amc","reason":"共同市场有助于理解竞争认知和行动动机","description":"","featured":false,"from":"w5-commonality"},{"to":"w5-amc","reason":"资源配置会影响行动能力与回应方式","description":"","featured":false,"from":"w5-similarity"},{"to":"w5-response-factors","reason":"战略与战术行动的回应速度和承诺不同","description":"","featured":false,"from":"w5-actions"},{"to":"w5-followers","reason":"抢先与跟随都有条件及代价","description":"","featured":false,"from":"w5-first-mover"},{"to":"w5-fast-cycle","reason":"模仿难度不同，优势维护方式也不同","description":"","featured":false,"from":"w5-slow-cycle"},{"to":"w5-fast-cycle","reason":"标准周期与快周期的模仿速度及成本不同","description":"","featured":false,"from":"w5-standard-cycle"}],"cases":[{"short":"明确目标","title":"先回答：我们想创造什么价值？","text":"假设晨光咖啡希望让校园顾客在课间也能方便地买到稳定好喝的咖啡。先明确未来方向、经营业务与重视的价值，再考虑学生、员工、供应商和校园管理方各自会怎样影响决策。单独一句口号不足以证明已有竞争优势。","prompt":"如果只说“成为最好的咖啡店”，员工能据此判断该优先缩短取餐时间，还是增加更多口味吗？","analysis":"可以把愿景写成希望成为怎样的校园服务者，把使命明确为服务哪些顾客与提供什么产品，再用价值观指导日常取舍。接着检验竞争行动是否真的为顾客创造了对手难以复制的价值，并观察绩效。","nodes":["w1-strategy","w1-vision","w1-mission","w1-stakeholders"]},{"short":"分析外部","title":"看市场：机会在哪里，压力来自谁？","text":"假设调研发现一部分学生重视课间快速取餐，也有人偏好低糖饮品。先识别这些社会文化线索，再分析行业中的竞争店、供应商、顾客、新进入者，以及茶饮等替代选择。需求看起来不错，不等于行业盈利一定容易。","prompt":"竞争对手不只有隔壁咖啡店。如果学生用茶饮满足同一饮品需求，这项压力属于哪一力？","analysis":"这是替代品威胁，因为它来自本行业之外但能满足类似需求的产品。还应问供应商能否涨价、顾客换店是否容易、新店进入是否有障碍，并收集直接竞争者的目标、战略、假设和能力信息。","nodes":["w2-layers","w2-sociocultural","w2-substitutes","w2-attractiveness","w2-competitor"]},{"short":"盘点内部","title":"看自己：有什么资源，能组成什么能力？","text":"设备和资金是资源，员工技能、信任与服务经验也可以成为资源。假设晨光咖啡能把预约系统、员工分工和饮品制作流程协调起来，稳定完成课间订单，这才体现组织能力。接着判断这种能力是否有价值、稀缺、难模仿且不可替代。","prompt":"买到同样的咖啡机，是否就能复制整套快速、稳定的取餐体验？","analysis":"设备可以被买到，但协调流程、经验与信任未必能立刻复制。是否真是核心能力仍需与竞争者比较，不能仅凭自己感觉。价值链分析可找出创造顾客价值的活动，也可发现瓶颈并考虑适当的外包边界。","nodes":["w3-resources","w3-capabilities","w3-core-competencies","w3-vrin","w3-value-chain"]},{"short":"选择战略","title":"定竞争方式：聚焦差异化是否合适？","text":"假设晨光咖啡选择校园顾客这一较窄市场，以可靠的预约取餐和稳定服务满足其特定需求。这可作为聚焦差异化的分析例子，但必须确认顾客重视这种不同，并用相应能力和价值链活动支持它。简单降价和随意增加特色，不能自动形成整合战略。","prompt":"为什么“校园小店”这个身份本身，不能直接证明它已经采用了聚焦差异化？","analysis":"聚焦描述服务一个特定细分市场，而差异化描述在该市场如何创造顾客重视的独特价值。需要看到有意识的定位和一组协调行动。仍应考虑需求变化、对手更精准地聚焦，以及大企业进入该细分市场的风险。","nodes":["w4-business-strategy","w4-differentiation","w4-focus","w4-focus-risks","w4-integrated"]},{"short":"预测回应","title":"预判对手：会注意、想回应、能回应吗？","text":"假设附近连锁店推出短期优惠。先分清这是怎样的竞争行动，再用市场共同性与资源相似性判断双方关系，用 AMC 检查对手是否认知到威胁、有动机回应、具备所需资源。还要看校园市场对其收入的重要性，以及回应行动的承诺和实施时间。","prompt":"如果连锁店资金充足，但校园市场收入占比很小，它就一定会立即跟进吗？","analysis":"不能只从能力推断行动。市场依赖与动机会影响回应可能性，行动类型和对手声誉也值得考虑。短期促销可能较容易被模仿；协调服务是否难复制需另行检验。观察实际结果后，回到外部与内部分析并更新战略。","nodes":["w5-actions","w5-commonality","w5-amc","w5-response-factors","w5-fast-cycle"]}],"comparisons":[{"title":"资源与能力","a":"资源 Resources","aId":"w3-resources","aText":"企业拥有或能够使用的投入与资产。","b":"能力 Capabilities","bId":"w3-capabilities","bText":"把资源组合起来执行任务的本领。","tip":"咖啡机是资源，稳定协调制作与取餐是能力。"},{"title":"VRIN 与 VRIO","a":"VRIN","aId":"w3-vrin","aText":"本章正文第四项 N 是不可替代性。","b":"VRIO","bId":"w1-vrin","bText":"第一章提及 O 是 Organization，未详细展开。","tip":"不要把 N 与 O 当成同一个意思；注意第一章括号与正文的差异。"},{"title":"一般与行业环境","a":"一般环境","aId":"w2-layers","aText":"更广泛的社会因素，分为七个段。","b":"行业环境","bId":"w2-attractiveness","bText":"直接影响竞争的五种力量。","tip":"经济趋势与购买者议价力属于不同分析层次。"},{"title":"成本与价格","a":"成本领先","aId":"w4-cost-leadership","aText":"以相对竞争者较低的成本提供可接受特色。","b":"差异化","bId":"w4-differentiation","bText":"提供顾客重视的独特属性，可能支持溢价。","tip":"降价是市场动作，不足以证明企业拥有低成本结构。"},{"title":"聚焦与整合","a":"聚焦战略","aId":"w4-focus","aText":"服务特定细分市场，采用聚焦成本领先或聚焦差异化。","b":"整合战略","bId":"w4-integrated","bText":"同时追求较低成本与有意义的差异化。","tip":"聚焦关心服务范围，整合关心同时建立的竞争优势。"},{"title":"战略与战术行动","a":"战略行动","aId":"w5-actions","aText":"涉及较多资源，较难实施或逆转。","b":"战术行动","bId":"w5-response-factors","bText":"调整或微调战略，通常较易实施与逆转。","tip":"重大新设施投入与短期促销的承诺不同。"},{"title":"市场共同性与依赖","a":"市场共同性","aId":"w5-commonality","aText":"两家企业共同参与哪些市场及其重要性。","b":"市场依赖","bId":"w5-response-factors","bText":"一家企业收入或利润来自某市场的程度。","tip":"一个比较双方交集，一个看单家企业对市场的依赖。"},{"title":"慢周期与快周期","a":"慢周期市场","aId":"w5-slow-cycle","aText":"模仿难、代价高且耗时，优势较受保护。","b":"快周期市场","bId":"w5-fast-cycle","bText":"模仿快、成本低，优势需要连续更新。","tip":"周期判断围绕优势的可模仿性，不能只看产品寿命长短。"}]};

<script>(function(root){
  'use strict';
  const key='mgt4001.mastered.v1';
  const normalize=s=>String(s??'').normalize('NFKC').toLocaleLowerCase().replace(/[\s·/–—]+/g,' ').trim();
  const Core={
    search(weeks,query){
      const q=normalize(query);if(!q)return [];
      const terms=q.split(' ');
      return weeks.flatMap(w=>w.nodes.map(n=>{
        const title=normalize(n.title+' '+n.en);
        const body=normalize([title,n.summary,n.explanation,...(n.bullets??[])].join(' '));
        const score=terms.every(t=>body.includes(t))?(title.includes(q)?100:terms.filter(t=>title.includes(t)).length*15+1):0;
        return {...n,weekId:w.id,weekTitle:w.title,score};
      })).filter(n=>n.score>0).sort((a,b)=>b.score-a.score);
    },
    readProgress(storage,validIds){try{const values=JSON.parse(storage?.getItem(key)??'[]');return Array.isArray(values)?[...new Set(values.filter(v=>validIds.includes(v)))]:[];}catch{return []; }},
    writeProgress(storage,ids){try{storage.setItem(key,JSON.stringify([...new Set(ids)]));return true;}catch{return false;}},
    quizStats(questions,answers){const answered=questions.filter(q=>Object.hasOwn(answers,q.id));const wrong=answered.filter(q=>answers[q.id]!==q.answer);return {total:questions.length,answered:answered.length,correct:answered.length-wrong.length,wrongIds:wrong.map(q=>q.id)};},
    normalize
  };
  if(typeof module==='object'&&module.exports)module.exports=Core;else root.KnowledgeCore=Core;
})(typeof window==='object'?window:globalThis);
</script>

function overview(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">BUSINESS POLICY & STRATEGY · WEEKS 01–05</div><h1>把知识连起来，<br>让<em>战略管理</em>更好懂。</h1><p>从理解竞争优势，到分析环境、选择战略与预测对手。<br>跟着一张知识地图，建立你的战略思考框架。</p><div class="hero-actions"><button class="button primary" data-nav="chapter" data-week="w1">开始学习 ${icon('arrow',14)}</button><button class="button" data-nav="connections">${icon('link',14)} 看知识如何串联</button></div></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="orbit-center">${icon('nodes',30)}</div><div class="orbit-point p1">${icon('target',20)}</div><div class="orbit-point p2">${icon('globe',20)}</div><div class="orbit-point p3">${icon('gem',20)}</div><div class="orbit-point p4">${icon('activity',20)}</div><div class="spark"></div><div class="spark s2"></div></div></section>
 <div class="stats">${[['book',5,'章','学习主题'],['nodes',allNodes.length,'个','核心知识点'],['file',285,'页','原课件内容'],['quiz',questions.length,'题','理解自测']].map(([i,n,u,l])=>`<div class="stat"><div class="stat-icon">${icon(i,20)}</div><div><strong>${n}</strong><small>${u}</small><p>${l}</p></div></div>`).join('')}</div>
 <div class="section-heading"><div><h2>一张地图，理解五章的关系</h2><p>外部机会与内部能力一起决定战略，竞争结果推动下一轮分析。</p></div><div class="legend"><span>●</span> 点击章节，展开知识点</div></div>
